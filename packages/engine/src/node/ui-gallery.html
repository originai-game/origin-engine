<!doctype html>
<!-- The UI gallery's page (ui-gallery.ts serves it): the review sheets by category, each in a
     frame running the engine (WebGPU), with style, scheme, page and viewport switches, and the
     server's re-cooked files swapped into the open frame as they land. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Origin Engine · UI gallery</title>
<style>
  :root { color-scheme: dark; --ink: #e8e8ec; --muted: #9a9aa6; --line: #2a2a32; --panel: #141418; --bg: #0b0b0e; --accent: #8fb4ff; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template: "nav bar" auto "nav stage" 1fr "nav log" auto / 220px 1fr; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  nav { grid-area: nav; overflow: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 10px 0; }
  nav h1 { font-size: 13px; margin: 0 14px 10px; color: var(--muted); font-weight: 600; }
  nav .cat { padding: 6px 14px; cursor: pointer; font-weight: 600; text-transform: capitalize; }
  nav .cat:hover { background: #1d1d23; }
  nav .cat.on { color: var(--accent); }
  nav .page { padding: 3px 14px 3px 28px; cursor: pointer; color: var(--muted); }
  nav .page:hover { color: var(--ink); }
  nav .page.on { color: var(--accent); }
  header { grid-area: bar; display: flex; gap: 14px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  select, button { background: #1d1d23; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: #2b3550; color: var(--accent); }
  #stage { grid-area: stage; position: relative; overflow: hidden; display: grid; place-items: center; }
  #frame-box { position: relative; transform-origin: center; box-shadow: 0 0 0 1px var(--line); }
  iframe { border: 0; display: block; background: #000; }
  #veil { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  footer { grid-area: log; border-top: 1px solid var(--line); padding: 6px 12px; color: var(--muted); font: 12px/1.5 ui-monospace, monospace; max-height: 30vh; overflow: auto; white-space: pre-wrap; }
  footer .ok { color: #8fd18f; } footer .err { color: #ff8f8f; }
</style>
</head>
<body>
<nav><h1>UI gallery</h1><div id="cats"></div></nav>
<header>
  <label>Style <select id="style"></select></label>
  <label>Scheme <span class="seg" id="scheme"><button data-v="dark" class="on">Dark</button><button data-v="light">Light</button></span></label>
  <label>Viewport <select id="viewport">
    <option value="1920x1080">Desktop 1920×1080</option>
    <option value="1280x720">Laptop 1280×720</option>
    <option value="1024x768">Tablet 1024×768</option>
    <option value="390x844">Phone portrait 390×844</option>
    <option value="844x390">Phone landscape 844×390</option>
  </select></label>
  <button id="reload" title="Load the frame again">Reload frame</button>
  <span id="status" style="color: var(--muted)"></span>
</header>
<main id="stage"><div id="frame-box"><iframe id="frame" title="sheet"></iframe></div><div id="veil"></div></main>
<footer id="log"></footer>
<script type="module">
const $ = (id) => document.getElementById(id);
const frame = $("frame");
const q = new URLSearchParams(location.hash.slice(1));
const state = { sheet: q.get("sheet"), page: q.get("page"), style: q.get("style") ?? "default", scheme: q.get("scheme") ?? "dark", viewport: q.get("viewport") ?? "1920x1080" };
let catalogue = { sheets: [], packs: [] };
let ready = false;

function log(text, cls = "") {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
  $("log").prepend(line);
}
const veil = (text) => ($("veil").textContent = text ?? "");
const sheetOf = (name) => catalogue.sheets.find((s) => s.name === name);
const probe = () => frame.contentWindow?.__runtime_probe__;
const saveHash = () => (location.hash = new URLSearchParams(Object.entries(state).filter(([, v]) => v)).toString());

function fit() {
  const [w, h] = state.viewport.split("x").map(Number);
  frame.width = w; frame.height = h;
  const stage = $("stage").getBoundingClientRect();
  const k = Math.min(1, (stage.width - 24) / w, (stage.height - 24) / h);
  $("frame-box").style.transform = `scale(${k})`;
  $("status").textContent = `${w}×${h}${k < 1 ? ` at ${Math.round(k * 100)}%` : ""}`;
}
addEventListener("resize", fit);

function renderNav() {
  const cats = $("cats");
  cats.replaceChildren();
  for (const s of catalogue.sheets) {
    const c = document.createElement("div");
    c.className = "cat" + (s.name === state.sheet ? " on" : "");
    c.textContent = s.name;
    c.onclick = () => open(s.name, s.pages[0]);
    cats.append(c);
    if (s.name !== state.sheet) continue;
    for (const p of s.pages) {
      const e = document.createElement("div");
      e.className = "page" + (p === state.page ? " on" : "");
      e.textContent = p.replace(/:/g, " · ");
      e.onclick = () => { state.page = p; saveHash(); renderNav(); apply(); };
      cats.append(e);
    }
  }
  const sel = $("style");
  sel.replaceChildren();
  const supported = sheetOf(state.sheet)?.styles ?? [];
  for (const p of catalogue.packs) {
    const o = new Option(p + (supported.includes(p) ? "" : " (not in this sheet)"), p, false, p === state.style);
    o.disabled = !supported.includes(p);
    sel.append(o);
  }
  for (const b of $("scheme").children) {
    b.classList.toggle("on", b.dataset.v === state.scheme);
    b.disabled = !sheetOf(state.sheet)?.scheme;
  }
}

/**
 * The page, style and scheme the switches name, as the sheet's commands. One runs at a time and
 * switches made meanwhile collapse into one more run with the newest state, so they never stack.
 */
let applying = null;
let reapply = false;
async function apply() {
  if (applying) { reapply = true; return applying; }
  applying = (async () => {
    do { reapply = false; await applyNow(); } while (reapply);
  })().finally(() => { applying = null; });
  return applying;
}

async function applyNow() {
  const p = probe();
  if (!ready || !p) return;
  const s = sheetOf(state.sheet);
  const steps = [];
  const style = s.styles.includes(state.style) ? state.style : s.styles[0];
  if (s.styles.length > 1 || style !== "default") steps.push(`0:style:${style}`);
  if (s.scheme) steps.push(`0:scheme:${state.scheme}`);
  if (state.page) steps.push(`0:page:${state.page}`);
  if (steps.length) await p.commands(steps.join(";"));
}

async function waitProbe() {
  for (let i = 0; i < 600; i++) {
    const p = probe();
    if (p) {
      if (p.error) throw new Error(p.error.message ?? String(p.error));
      try { if ((await p.tick()) > 0) return p; } catch { /* not started yet */ }
    }
    await new Promise((r) => setTimeout(r, 100));
  }
  throw new Error("the engine did not start in 60 s");
}

/** Bumped by every open, so an older open that is still loading stops at its next step. */
let opened = 0;
async function open(name, page) {
  if (!name) return;
  const epoch = ++opened;
  ready = false;
  state.sheet = name; state.page = page ?? sheetOf(name)?.pages[0] ?? null;
  if (!sheetOf(name).styles.includes(state.style)) state.style = sheetOf(name).styles[0];
  saveHash(); renderNav(); fit();
  veil(`Building ${name}…`);
  const r = await fetch(`/api/open/${name}`).then((r) => r.json());
  if (epoch !== opened) return;
  if (!r.ok) { veil(""); return log(`${name}: ${r.error}`, "err"); }
  veil(`Starting the engine…`);
  const t0 = performance.now();
  frame.src = `/s/${name}/index.html`;
  await new Promise((r) => (frame.onload = r));
  if (epoch !== opened) return;
  try {
    await waitProbe();
    if (epoch !== opened) return;
    ready = true;
    await apply();
    veil("");
    log(`${name} started in ${Math.round(performance.now() - t0)} ms`);
  } catch (e) {
    if (epoch !== opened) return;
    veil("");
    log(`${name}: ${e.message}`, "err");
  }
}

/**
 * The server's re-cooked files into the open frame, applied in place (devFiles: no hot reload).
 * One swap at a time: an edit that lands while one runs waits, and the edits that land meanwhile
 * go in one swap, so a burst of saves never stacks; a newer one supersedes what still waits.
 */
let swapping = false;
let waiting = null;
async function swap(event) {
  if (event.sheet !== state.sheet) return;
  if (swapping) {
    waiting = waiting ? { ...event, edits: [...new Set([...waiting.edits, ...event.edits])], files: [...new Set([...waiting.files, ...event.files])], cookMs: waiting.cookMs + event.cookMs } : event;
    return;
  }
  swapping = true;
  try {
    await swapNow(event);
  } finally {
    swapping = false;
  }
  if (waiting) {
    const next = waiting;
    waiting = null;
    void swap(next).catch((err) => log(String(err), "err"));
  }
}

async function swapNow(event) {
  const p = probe();
  if (!ready || !p?.devFiles || event.sheet !== state.sheet) return;
  const t0 = performance.now();
  const root = new URL(".", frame.contentWindow.location.href).href.replace(/\/$/, "");
  const files = await Promise.all(event.files.map(async (f) => [`${root}/cooked/${f}`, new Uint8Array(await (await fetch(`/s/${state.sheet}/cooked/${f}`, { cache: "no-store" })).arrayBuffer())]));
  const fetched = performance.now();
  const r = await p.devFiles(files);
  const swapped = performance.now();
  // The first frame drawn after it: the frame's next animation frame once the Worker answered.
  await new Promise((done) => frame.contentWindow.requestAnimationFrame(() => frame.contentWindow.requestAnimationFrame(done)));
  const drawn = performance.now();
  const ok = r && !r.error;
  const steps = Object.entries(r?.steps ?? {}).map(([k, v]) => `${k} ${v}`).join(", ");
  const timing = {
    serverMs: event.serverMs ?? event.cookMs,
    cookMs: event.cookMs,
    fetchMs: Math.round(fetched - t0),
    workerMs: r?.ms ?? null,
    callMs: Math.round(swapped - fetched),
    frameMs: Math.round(drawn - swapped),
  };
  timing.totalMs = Math.round((event.serverMs ?? event.cookMs) + (drawn - t0));
  window.__gallery_last_reload__ = { edits: event.edits, files: event.files.length, ok, steps: r?.steps, ...timing };
  window.__gallery_reloads__ = [...(window.__gallery_reloads__ ?? []), window.__gallery_last_reload__];
  log(`${event.edits.join(", ")}: ${ok ? "applied" : `refused: ${r?.error ?? r?.warnings}`} in ${timing.totalMs} ms (save→cooked ${timing.serverMs} [cook ${timing.cookMs}] + fetch ${timing.fetchMs} + apply ${timing.callMs} [${steps}] + frame ${timing.frameMs}; ${event.files.length} file(s))`, ok ? "ok" : "err");
  if (r?.warnings?.length) log(r.warnings.join("\n"), "err");
}

new EventSource("/api/events").onmessage = (m) => {
  const e = JSON.parse(m.data);
  if (e.type === "files") void swap(e).catch((err) => log(String(err), "err"));
  if (e.type === "building") log(`${e.edits.join(", ")}: rebuilding ${e.sheet}…`);
  if (e.type === "rebuilt") { log(`${e.sheet} rebuilt in ${e.ms} ms; loading it again`, "ok"); void open(state.sheet, state.page); }
  if (e.type === "error") log(`${e.edits.join(", ")}: ${e.error}`, "err");
};

$("style").onchange = (e) => { state.style = e.target.value; saveHash(); void apply(); };
$("viewport").value = state.viewport;
$("viewport").onchange = (e) => { state.viewport = e.target.value; saveHash(); fit(); };
for (const b of $("scheme").children) b.onclick = () => { state.scheme = b.dataset.v; saveHash(); renderNav(); void apply(); };
$("reload").onclick = () => open(state.sheet, state.page);

catalogue = await fetch("/api/sheets").then((r) => r.json());
state.sheet ??= catalogue.sheets.find((s) => s.name === "components")?.name ?? catalogue.sheets[0]?.name;
fit();
await open(state.sheet, state.page);
</script>
</body>
</html>
