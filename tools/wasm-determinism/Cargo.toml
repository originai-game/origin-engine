# Cross-target determinism check: the same og-core math, the same og-ecs
# world, the same og-physics and og-anim worlds on the host and on wasm32,
# compared bit for bit. Not a workspace member (its own [workspace] below);
# run it with ./run.sh.
[package]
name = "wasm-determinism"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wasm-determinism"
path = "src/main.rs"

[dependencies]
og-core = { path = "../../crates/og-core" }
og-ecs = { path = "../../crates/og-ecs" }
# The physics profiles as og-host-web's variants take them: both by default
# (the host builds and the single-threaded wasm), one each for the lanes
# builds run.sh makes per profile (scripts/wasm-crates.txt `lanes` lines).
og-physics = { path = "../../crates/og-physics", default-features = false }
og-anim = { path = "../../crates/og-anim" }
og-lanes = { path = "../../crates/og-lanes" }

[features]
default = ["physics2d", "physics3d"]
physics2d = ["og-physics/physics2d"]
physics3d = ["og-physics/physics3d"]

[workspace]

# As in the workspace: physics at -O0 would take minutes in the debug run.
[profile.dev.package.og-physics]
opt-level = 3
[profile.dev.package.rapier2d]
opt-level = 3
[profile.dev.package.rapier3d]
opt-level = 3
[profile.dev.package.parry2d]
opt-level = 3
[profile.dev.package.parry3d]
opt-level = 3
[profile.dev.package.glamx]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3
[profile.dev.package.simba]
opt-level = 3
[profile.dev.package.wide]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
