# Shipping and size measurements never use Cranelift.
[profile.release]
codegen-backend = "llvm"

[profile.wasm]
codegen-backend = "llvm"

[profile.wasm-gate]
codegen-backend = "llvm"

[target.'cfg(target_os = "linux")']
rustflags = ["-Zthreads=4", "-C", "link-arg=-fuse-ld=mold"]

# studio-win: Cranelift in dev/test (with the package overrides above),
# LLVM when shipping. rust-lld uses its lld-link frontend for MSVC.
# Configuration only: not yet verified on studio-win.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-Zthreads=4"]

# Cranelift has no wasm backend, including cargo check in the dev profile.
[target.'cfg(target_arch = "wasm32")']
rustflags = ["-Zthreads=4", "-Zcodegen-backend=llvm"]

# cg_clif and LLVM still disagree on parts of the arm64 macOS Rust ABI.
# Mixed generic SIMD code hangs in HashMap insertion on this nightly.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))']
rustflags = ["-Zthreads=4", "-Zcodegen-backend=llvm"]
