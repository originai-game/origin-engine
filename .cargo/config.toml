# Every build here goes through sccache, so a fresh worktree (scripts/worktree.sh)
# takes its dependencies from the cache the main checkout filled instead of
# compiling them again (docs/ci.md §Lanes: a fresh worktree's test build in
# about a minute). sccache caches only non-incremental units: dependencies,
# release, wasm32; the workspace's own dev crates are incremental and compile.
# scripts/install-tools.sh installs it. To build without it, for one command
# or a shell: RUSTC_WRAPPER= cargo build ... (an empty value turns the wrapper
# off); CI does that, caching target/ instead.
[build]
rustc-wrapper = "sccache"
rustflags = ["-Zthreads=4"]

[unstable]
codegen-backend = true
embed-metadata = false

[profile.dev]
codegen-backend = "cranelift"

[profile.dev.build-override]
codegen-backend = "llvm"

# LLVM fallbacks: napi exceeds Cranelift's Mach-O section limit;
# JPEG's ARM NEON sqxtn and physics' fmaxnm are unsupported intrinsics.
# Packages with an explicit dev opt-level retain LLVM optimization: the
# cook's codecs must write the shipping bytes and hot loops stay usable.
[profile.dev.package.adler2]
codegen-backend = "llvm"
[profile.dev.package.basis-universal]
codegen-backend = "llvm"
[profile.dev.package.basis-universal-sys]
codegen-backend = "llvm"
[profile.dev.package.fdsm]
codegen-backend = "llvm"
[profile.dev.package.glam]
codegen-backend = "llvm"
[profile.dev.package.glamx]
codegen-backend = "llvm"
[profile.dev.package.image]
codegen-backend = "llvm"
[profile.dev.package.itoa]
codegen-backend = "llvm"
[profile.dev.package.libm]
codegen-backend = "llvm"
[profile.dev.package.memchr]
codegen-backend = "llvm"
[profile.dev.package.meshopt]
codegen-backend = "llvm"
[profile.dev.package.miniz_oxide]
codegen-backend = "llvm"
[profile.dev.package.naga]
codegen-backend = "llvm"
[profile.dev.package.nalgebra]
codegen-backend = "llvm"
[profile.dev.package.og-bake]
codegen-backend = "llvm"
[profile.dev.package.og-cook]
