# Share dependency compilation across the persistent lanes through
# sccache, by og-sccache-wrap (crates/og-sccache-wrap, installed by
# scripts/install-tools.sh): it starts sccache's shared server without the
# jobserver of the build that needs it first. Set RUSTC_WRAPPER= for a
# command that must bypass both.
# Every target and profile uses rustc's LLVM backend.
[build]
rustc-wrapper = "og-sccache-wrap"
rustflags = ["-Zthreads=4"]

[target.'cfg(target_os = "linux")']
rustflags = ["-Zthreads=4", "-C", "link-arg=-fuse-ld=mold"]

# rust-lld selects its lld-link frontend for MSVC. Unverified on studio-win.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-Zthreads=4"]
