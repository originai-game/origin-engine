[workspace]
resolver = "2"
members = ["crates/og-core", "crates/og-core-derive", "crates/og-ecs", "crates/og-api", "crates/og-render", "crates/og-cook", "crates/og-blob", "crates/og-probe", "crates/og-input", "crates/og-physics", "crates/og-audio", "crates/og-ui", "crates/og-host-web", "crates/og-host-node", "crates/og-cli", "crates/og-tests"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl"] }
glam = { version = "0.34.1", features = ["bytemuck", "scalar-math"] }
gltf = { version = "1.4.1", features = ["import", "utils", "KHR_materials_emissive_strength"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The cook's encoders are unusable at -O0 (a debug cook takes a minute and
# basisu writes different UASTC bytes than release); keep them optimised in dev.
[profile.dev.package.basis-universal-sys]
opt-level = 3
[profile.dev.package.basis-universal]
opt-level = 3
[profile.dev.package.meshopt]
opt-level = 3
[profile.dev.package.fdsm]
opt-level = 3
