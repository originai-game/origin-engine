[workspace]
resolver = "2"
members = ["crates/og-spike"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl"] }
glam = { version = "0.34.1", features = ["bytemuck"] }
gltf = { version = "1.4.1", features = ["import", "utils", "KHR_materials_emissive_strength"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
