[workspace]
resolver = "2"
members = ["crates/og-core", "crates/og-geom", "crates/og-destruct", "crates/og-core-derive", "crates/og-ecs", "crates/og-lanes", "crates/og-api", "crates/og-records", "crates/og-idl", "crates/og-runtime", "crates/og-draw", "crates/og-render", "crates/og-bake", "crates/og-cook", "crates/og-bundle", "crates/og-blob", "crates/og-probe", "crates/og-input", "crates/og-physics", "crates/og-anim", "crates/og-tween", "crates/og-timeline", "crates/og-tilemap", "crates/og-audio", "crates/og-nav", "crates/og-ai", "crates/og-story", "crates/og-motion", "crates/og-i18n", "crates/og-net", "crates/og-css", "crates/og-text", "crates/og-ui", "crates/og-video", "crates/og-video-wasm", "crates/og-host-web", "crates/og-host-node", "crates/og-cli", "crates/og-sccache-wrap", "crates/og-tests", "crates/og-tests-cooked", "crates/og-tests-ui", "crates/og-tests-web"]

# A vendored dependency, patched in below; not a member (no fmt, clippy or tests of ours).
exclude = ["third_party"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl"] }
glam = { version = "0.34.1", features = ["bytemuck", "scalar-math"] }
gltf = { version = "1.4.1", features = ["import", "utils", "KHR_materials_emissive_strength", "extensions", "extras"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
log = "0.4"
# The Opus codec (RFC 6716), pure Rust and no dependencies (BSD-3-Clause):
# og-bundle's `opus` (the cook encodes, og-audio decodes).
opus-pure = "0.2.2"

# No debuginfo in dev. On macOS, debuginfo stays in the object files
# (split-debuginfo unpacked) and rustc never removes an incremental unit's
# old objects, so target/debug/deps had grown to 252,881 .o files; every
# process that opens a Metal device reads its executable's directory
# (CFBundle), which cost each GPU test 1.4 s of its 1.7 s
# (tests/evidence/build-speed-2026-10.md). Panics still name file and line;
# for line numbers in a backtrace, CARGO_PROFILE_DEV_DEBUG=line-tables-only
# (CI sets it: on Linux debuginfo lives in the executable). The gate runs
# every native step in this profile (AGENTS.md §Build and gate discipline).
[profile.dev]
debug = false
# Dependencies never carry debuginfo, also where CARGO_PROFILE_DEV_DEBUG
# turns it on for the workspace (CI).
[profile.dev.package."*"]
debug = false
# objc2 verifies every Objective-C message's signature against the
# runtime's under debug assertions: most of a dev frame's CPU on Metal
# (gltf-reference 3.8 to 1.0 ms a frame in og-gfx without it,
# tests/evidence/P4/parity/). wgpu-hal's messages are wgpu's to verify.
[profile.dev.package.objc2]
debug-assertions = false
# og.motion's model runs on the CPU every tick (crates/og-motion/src/cpu.rs):
# about 1 GFLOP a generation, 40 ms optimised and seconds at opt-level 0,
# which every test with a motion agent would wait for.
[profile.dev.package.og-motion]
opt-level = 3

# Native shipping and explicit native performance runs. Never used for
# tests, drift or the gate's addon; shipping wasm uses profile.wasm below.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Functional wasm: no shipping-size work, no debug info or assertions.
# Level 1 keeps frame and physics loops within browser test timeouts.
[profile.wasm-test]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
debug = false
[profile.wasm-test.package.og-motion]
opt-level = 3

# Shipping bindgen wasm, measured directly by the size gate: release at
# opt-level s, with the crates whose loops run every tick or frame at 3 and
# the crates that run only while loading or when something changes (font
# shaping, the cooked bundle's decoding and
# decompression, snapshots' bincode, navmesh triangulation, locale tables)
# at z. Load-time crates at z: -85 KB brotli (tests/evidence/E7/wasm-size.md,
# with Chrome's frame times unchanged; z for every crate cost 25 % of a
# frame). The s default (tests/evidence/r4/size-2/NOTES.md): physics
# (rapier, parry, og-physics, the math), og-ecs, og-render, og-anim,
# og-lanes, og-ui, wgpu's WebGPU front end, og-nav and og-ai stay at 3;
# og-runtime (the frame's extract and the bindings' glue) and the rest go
# to s. Native builds never use it.
[profile.wasm]
inherits = "release"
opt-level = "s"
[profile.wasm.package.rapier3d]
opt-level = 3
[profile.wasm.package.rapier2d]
opt-level = 3
[profile.wasm.package.parry3d]
opt-level = 3
[profile.wasm.package.parry2d]
opt-level = 3
[profile.wasm.package.og-physics]
opt-level = 3
[profile.wasm.package.glam]
opt-level = 3
[profile.wasm.package.nalgebra]
opt-level = 3
[profile.wasm.package.simba]
opt-level = 3
[profile.wasm.package.og-ecs]
opt-level = 3
[profile.wasm.package.og-render]
opt-level = 3
# The draw commands (og-render's before the split): the UI writes them every frame.
[profile.wasm.package.og-draw]
opt-level = 3
[profile.wasm.package.og-anim]
opt-level = 3
# og.motion's per-frame decode, retargeting and foot plant (the coordinator,
# 2026-11-02; the size gate measures it).
[profile.wasm.package.og-motion]
opt-level = 3
[profile.wasm.package.og-lanes]
opt-level = 3
[profile.wasm.package.og-ui]
opt-level = 3
# og-ui's text (before the split): measured every frame the UI lays out.
[profile.wasm.package.og-text]
opt-level = 3
[profile.wasm.package.og-css]
opt-level = 3
[profile.wasm.package.wgpu]
opt-level = 3
[profile.wasm.package.og-nav]
opt-level = 3
[profile.wasm.package.og-ai]
opt-level = 3
[profile.wasm.package.naga-types]
opt-level = "z"
[profile.wasm.package.harfrust]
opt-level = "z"
[profile.wasm.package.ttf-parser]
opt-level = "z"
[profile.wasm.package.skrifa]
opt-level = "z"
[profile.wasm.package.read-fonts]
opt-level = "z"
[profile.wasm.package.unicode-width]
opt-level = "z"
[profile.wasm.package.bincode]
opt-level = "z"
[profile.wasm.package.og-cook]
opt-level = "z"
# Fork s73: og-bundle's runtime (og-cook's before the split) decodes every
# cooked model a game loads (meshopt vertex/index streams, octahedral
# normals, LOD and BVH rows); at "z" a 1072-cell web boot spent 7-9 s of its
# worker there (decode_deltas alone 3.3 s). The publish wasm grew 11.25 to
# 11.33 MB on 0.7.7.
[profile.wasm.package.og-bundle]
opt-level = 3
[profile.wasm.package.og-blob]
opt-level = "z"
[profile.wasm.package.miniz_oxide]
opt-level = "z"
[profile.wasm.package.spade]
opt-level = "z"
[profile.wasm.package.rstar]
opt-level = "z"
[profile.wasm.package.og-i18n]
opt-level = "z"

# The cook's encoders are unusable at -O0 (a debug cook takes a minute and
# basisu writes different UASTC bytes than release); keep them optimised in dev.
[profile.dev.package.basis-universal-sys]
opt-level = 3
[profile.dev.package.basis-universal]
opt-level = 3
[profile.dev.package.meshopt]
opt-level = 3
# The FBX reader (og-cook's fbx.rs): its C parses and bakes every clip.
[profile.dev.package.ufbx]
opt-level = 3
# The Opus codec: the cook encodes every Opus sound and the mixer decodes
# its blocks as voices reach them; at -O0 a packet costs about 20 times
# its optimised 56 us and a 3-minute track's test minutes.
[profile.dev.package.opus-pure]
opt-level = 3
# The AV1 decoder: at -O0 a 720p frame takes most of a second. Without
# debug assertions, as it ships (release, wasm): they switch on rav1d's
# DisjointMut overlap checker, which aborts the process on a false
# positive under tile threading, cdef's top-row borrow taking the two
# left-padding pixels it never reads at a picture's left edge, which
# another worker's cdef_apply line backup is writing.
[profile.dev.package.rav1d]
opt-level = 3
debug-assertions = false
[profile.dev.package.fdsm]
opt-level = 3
# Physics at -O0 runs the 500-body determinism pile for a quarter of an hour.
# og-physics is listed too: rapier's generic code is instantiated in it.
[profile.dev.package.og-physics]
opt-level = 3
# The light baker traces millions of rays (og bake lightmaps); xatlas is
# compiled by its build script at the same level.
[profile.dev.package.og-bake]
opt-level = 3
[profile.dev.package.rapier2d]
opt-level = 3
[profile.dev.package.rapier3d]
opt-level = 3
[profile.dev.package.parry2d]
opt-level = 3
[profile.dev.package.parry3d]
opt-level = 3
[profile.dev.package.glamx]
opt-level = 3
[profile.dev.package.glam]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3
[profile.dev.package.simba]
opt-level = 3
[profile.dev.package.libm]
opt-level = 3
[profile.dev.package.wide]
opt-level = 3
# Every GPU test records hundreds of commands through wgpu-core at -O0;
# optimised, og-tests' effects and gfx suites ran 23 % faster (13.4 s to
# 10.4 s for five tests, tests/evidence/build-speed-2026-10.md). They are
# dependencies, so the cost is one rebuild (cached by sccache), not the loop.
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-types]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
# Every probe screenshot and reference frame is deflated by miniz_oxide: at
# -O0 one 1280x720 PNG took 0.95 s of the tick that captured it (lantern-vale
# FINDINGS #32 read it as a stall), optimised about 40 ms.
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
# The engine API's arguments and answers are JSON text (og-runtime's parse
# and the json! answers): at -O0 serde_json was more than half of a UI kit
# frame (3964 of 6911 samples, templates/ui-kit patterns without a
# renderer). A dependency, so the cost is one rebuild, not the loop.
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.itoa]
opt-level = 3
[profile.dev.package.zmij]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3

# The workspace crates in 16 codegen units instead of incremental's 256:
# an edit recompiles and links fewer, larger units (an og-core edit's test
# build 10.4 s to 6.6 s, og-render's 7.5 s to 4.3 s under another agent's
# load; tests/evidence/build-speed-2026-10.md). Incremental stays on; off
# was slower (og-render 7.5 s to 9.5 s). og-physics keeps the default with
# its opt-level 3 above.
# og-ui, og-runtime and og-cook at opt-level 1, as og-nav: every frame of a
# game the tests run lays out its UI and answers its API calls, and every
# test cook runs the cook's glyph outlines, all at -O0 before
# (tests/evidence/gate-speed/opt-levels.md has the numbers: the UI kit's
# components playtest 77.6 to 39.4 s of CPU with serde_json's line below,
# og-cook's thread-count test 108 to 65 s). An edit to one of them builds
# about 9 s longer.
[profile.dev.package.og-core]
codegen-units = 16
[profile.dev.package.og-core-derive]
codegen-units = 16
[profile.dev.package.og-ecs]
codegen-units = 16
[profile.dev.package.og-lanes]
codegen-units = 16
[profile.dev.package.og-render]
codegen-units = 16
[profile.dev.package.og-draw]
codegen-units = 16
[profile.dev.package.og-runtime]
opt-level = 1
codegen-units = 16
[profile.dev.package.og-cook]
opt-level = 1
codegen-units = 16
[profile.dev.package.og-bundle]
codegen-units = 16
[profile.dev.package.og-ui]
opt-level = 1
codegen-units = 16
[profile.dev.package.og-text]
opt-level = 1
codegen-units = 16
[profile.dev.package.og-css]
opt-level = 1
codegen-units = 16
[profile.dev.package.og-api]
codegen-units = 16
[profile.dev.package.og-records]
codegen-units = 16
[profile.dev.package.og-idl]
codegen-units = 16
[profile.dev.package.og-probe]
codegen-units = 16
[profile.dev.package.og-anim]
codegen-units = 16
[profile.dev.package.og-audio]
codegen-units = 16
[profile.dev.package.og-input]
codegen-units = 16
[profile.dev.package.og-nav]
opt-level = 1
codegen-units = 16
[profile.dev.package.og-ai]
codegen-units = 16
[profile.dev.package.og-tween]
codegen-units = 16
[profile.dev.package.og-timeline]
codegen-units = 16
[profile.dev.package.og-tilemap]
codegen-units = 16
[profile.dev.package.og-blob]
codegen-units = 16
[profile.dev.package.og-host-web]
codegen-units = 16
[profile.dev.package.og-host-node]
codegen-units = 16
[profile.dev.package.og-cli]
codegen-units = 16
[profile.dev.package.og-tests]
codegen-units = 16
[profile.dev.package.og-tests-cooked]
codegen-units = 16
[profile.dev.package.og-tests-ui]
codegen-units = 16

# basisu's UASTC RDO pass hashed its key's padding (stack garbage), so the
# cook's UASTC bytes followed what a thread had run before: the upstream fix,
# carried until a basis-universal-sys release has it
# (third_party/basis-universal-sys/Cargo.toml, crates/og-cook/README.md
# §Determinism).
[patch.crates-io]
basis-universal-sys = { path = "third_party/basis-universal-sys" }
glamx = { path = "third_party/glamx" }
