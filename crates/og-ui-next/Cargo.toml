[package]
name = "og-ui-next"
version = "0.9.0"
edition.workspace = true
license.workspace = true
publish = false
description = "og-ui's new core: a flat element arena, styles compiled to typed records, rune-taffy layout and quad paint."

[dependencies]
og-css = { path = "../og-css" }
# Text layout and glyph rasters: the engine's one text stack (og-text).
og-text = { path = "../og-text" }
# Its draw commands name fonts and textures by og-draw's handles.
og-draw = { path = "../og-draw" }
# Bindings: the expressions documents bind and their evaluation.
og-reactive = { path = "../og-reactive" }
nsh-reactive = { path = "../../third_party/nsh-reactive" }
# Tailwind classes resolved to styles (NSH's resolver).
nsh-tailwind = { path = "../../third_party/nsh-tailwind" }
nsh-input = { path = "../../third_party/nsh-input" }
# On-screen controls feed og-input actions as its control zones.
og-input = { path = "../og-input" }
# Rectangles (the focus rule's, `nav`).
og-ui-model = { path = "../og-ui-model" }
# An `Input`'s caret steps by grapheme cluster (UAX #29).
og-i18n = { path = "../og-i18n" }
rune-taffy = { path = "../../third_party/rune-taffy" }
# UI motion: transitions, presence and layout animation (src/motion.rs).
rune-motion = { path = "../../third_party/rune-motion" }
taffy = { version = "=0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size", "calc"] }
# The accessibility tree (a11y.rs), as og-ui pins it.
accesskit = { version = "=0.25.2", features = ["serde"] }
rustc-hash = "2"
bytemuck = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
# Its math (atan2 for a corner gradient's angle).
og-core = { path = "../og-core" }
# `<Particles>` steps the engine's particle simulation (its CPU path) and
# paints it (tree/particles.rs); og-env's force fields are an argument of it.
og-render-data = { path = "../og-render-data" }
og-env = { path = "../og-env" }

[[example]]
name = "gen-pack"
path = "scripts/gen_pack.rs"

# packages/design/tokens.json's generator (scripts/gen-tokens.sh runs it).
[[example]]
name = "gen-tokens"
path = "scripts/gen_tokens.rs"
