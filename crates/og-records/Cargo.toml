[package]
name = "og-records"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine records: the engine-owned record and column tables generated from crates/og-api/api/<module>.ogt (og-idl generates them), re-exported by og-api's host."

[features]
# A published game (og-runtime's `publish`, through og-api's): RECORDS' field
# docs are empty (`doc!` in src/lib.rs), so their text is not linked;
# nothing in a publish build reads them.
publish = []

[dependencies]
