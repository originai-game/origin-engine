[package]
name = "og-api"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine API: the host traits and record tables generated from api.ogt (og-idl generates them), and the host-neutral runtime."

[dependencies]

[dev-dependencies]
og-core = { path = "../og-core" }
og-idl = { path = "../og-idl" }
og-anim = { path = "../og-anim" }
og-tween = { path = "../og-tween" }
og-input = { path = "../og-input" }
og-physics = { path = "../og-physics" }
og-audio = { path = "../og-audio" }
# ThemeColor names og-ui's palette roles (tests/modules.rs).
og-ui = { path = "../og-ui", default-features = false }
serde_json = "1"
