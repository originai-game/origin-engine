[package]
name = "og-api"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine API: the IDL (api.ogt), its validator and generators (TypeScript, binding table, schema, host traits and glue), and the host-neutral runtime."

[dependencies]
og-core = { path = "../og-core" }
og-ecs = { path = "../og-ecs", optional = true }
og-render = { path = "../og-render", optional = true }
glam = { workspace = true, optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }

[features]
default = []
# The host-neutral runtime og-host-web and og-host-node wrap (`og_api::runtime`).
runtime = ["dep:og-ecs", "dep:og-render", "dep:glam", "dep:serde_json"]
