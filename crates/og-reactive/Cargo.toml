[package]
name = "og-reactive"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine UI bindings: the expression language of a document's attributes and text, and the reactive session of sources, computations and bindings, below og-ui."

[dependencies]
# Translations, plural messages and the pseudo-locale.
og-i18n = { path = "../og-i18n" }
# The texture handles an image binding names.
og-draw = { path = "../og-draw" }
# Viewmodels and bindings are JSON, as the host passes them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
