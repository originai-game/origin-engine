[package]
name = "og-shape-formats"
version = "0.9.0+dev.20261128.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false
description = "og-shape's file formats: glTF, OBJ, STL, USD, URDF, Draco, meshopt, KTX2 (UASTC, ETC1S), Zstandard, PNG, JPEG and WebP, read and written deterministically. Linked by the cook and the og tool only, never the runtime"

[dependencies]
og-core = { path = "../og-core" }
og-shape = { path = "../og-shape" }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
image-webp = "0.2.4"

# The determinism lint (clippy.toml beside this file).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
float_cmp = "allow"
