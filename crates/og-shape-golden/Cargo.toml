[package]
name = "og-shape-golden"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Prints the golden output hash of every og-shape case, for the gate to compare with hashes.txt on every target"

[dependencies]
og-shape = { path = "../og-shape" }
og-shape-cli = { path = "../og-shape-cli" }
# Compresses the arrays of the hand-written binary FBX case.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
float_cmp = "allow"
