[package]
name = "og-draw"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine draw commands: the overlay's sprites, text and UI shapes, the resource handles they name and the colour vision filter, as plain data that og-ui writes and og-render draws."

[dependencies]
og-core = { path = "../og-core" }
glam = { workspace = true }
bytemuck = { workspace = true }
serde = { version = "1", features = ["derive"] }
# The path model (`UiPath`) and its geometry: SVG path data, arcs,
# flattening, dashing, cubics to quadratics and stroke expansion. no_std
# with libm's maths (the cook's resvg turns kurbo's std on where it links).
kurbo = { version = "0.13.1", default-features = false, features = ["libm"] }
