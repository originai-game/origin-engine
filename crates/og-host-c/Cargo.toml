[package]
name = "og-host-c"
version = "0.9.0+dev.20261128.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine C ABI host: every binding symbol as an extern \"C\" entry over tagged values, for a native shell that embeds its own JavaScript engine (hermes/ is the Hermes one)."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["window"]
publish = ["og-runtime/publish"]
# The desktop window a store shell draws in (src/window.rs).
window = ["dep:winit", "dep:og-render", "dep:pollster", "dep:og-audio", "og-audio/device", "dep:gilrs-core", "dep:og-input", "dep:sys-locale", "dep:arboard"]

[dependencies]
og-api = { path = "../og-api" }
og-runtime = { path = "../og-runtime", default-features = false, features = ["fetch"] }
og-physics = { path = "../og-physics" }
# Basis textures transcoded natively, as og-host-node does (`Hooks::texture`).
og-bundle = { path = "../og-bundle", features = ["transcode"] }
og-render = { path = "../og-render", optional = true }
pollster = { workspace = true, optional = true }
serde_json = "1"
# A store provider's library (src/platform.rs).
libloading = "0.8"
winit = { version = "0.30.12", default-features = false, features = ["rwh_06", "x11"], optional = true }
og-audio = { path = "../og-audio", optional = true }
gilrs-core = { version = "0.6.8", optional = true }
og-input = { path = "../og-input", optional = true }
# The player's OS locale, which the shell names at the engine's creation (og_c_locale).
sys-locale = { version = "0.3", optional = true }
# The OS clipboard a text field copies to and pastes from (MIT OR Apache-2.0).
arboard = { version = "3.7", default-features = false, optional = true }
