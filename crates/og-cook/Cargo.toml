[package]
name = "og-cook"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine cook: assets/ to cooked/ .ogb blobs (meshopt meshes, KTX2 Basis textures, QOA audio, MSDF fonts, scene tables); og-bundle has the runtime loaders that read them."
autotests = false

[features]
default = ["cook", "basis", "transcode"]
# Native Basis Universal transcoding of cooked KTX2 textures to RGBA8 for
# og-render (og-bundle's `transcode`).
transcode = ["og-bundle/transcode"]
# The cook itself (native only): importers, encoders, the incremental manifest.
cook = ["og-render/bake", "dep:og-ai", "dep:og-story", "dep:og-i18n", "og-nav/bake", "dep:gltf", "og-render/gltf", "dep:image", "dep:image_dds", "dep:draco-core", "dep:meshopt", "dep:mikktspace", "dep:fdsm", "dep:fdsm-ttf-parser", "dep:ttf-parser", "dep:hound", "dep:symphonia", "dep:opus-pure", "dep:ruzstd", "dep:serde_json", "dep:nalgebra", "dep:og-ui", "dep:naga", "dep:og-records", "og-timeline/import", "dep:og-geom", "dep:ufbx"]
# Encode textures with the basis-universal crate (a default). Without it the
# cook looks for KTX-Software's `toktx` on PATH.
basis = ["og-bundle/basis", "dep:basis-universal", "dep:ruzstd"]

[dependencies]
# The blob formats and the runtime loaders (re-exported: `og_cook::runtime`, ...).
og-bundle = { path = "../og-bundle" }
og-blob = { path = "../og-blob" }
og-core = { path = "../og-core" }
og-render = { path = "../og-render" }
og-anim = { path = "../og-anim" }
# The cook validates UI skins with og-ui's parser (the runtime only reads their text).
og-ui = { path = "../og-ui", optional = true }
og-tilemap = { path = "../og-tilemap" }
# `type model`: the cook builds its parts with og-geom's generators.
og-geom = { path = "../og-geom", optional = true }
# Timelines and paths: the cook validates and canonicalises them (importing
# caption files), the runtime parses the canonical text.
og-timeline = { path = "../og-timeline" }
# The cook checks looks against the IDL's records (the reflected resources).
og-records = { path = "../og-records", optional = true }
# Navmeshes load into og-nav's types; the cook bakes them (og-nav's `bake`)
# and validates behaviours with og-ai's parser.
og-nav = { path = "../og-nav" }
og-ai = { path = "../og-ai", optional = true }
# Dialogues and quests are validated with og-story's parsers (G2-8).
og-story = { path = "../og-story", optional = true }
# String tables are checked, and shaped scripts found, at cook time.
og-i18n = { path = "../og-i18n", optional = true }
glam = { workspace = true }
bytemuck = { workspace = true }
miniz_oxide = "0.8"
basis-universal = { version = "0.3.1", optional = true }
ruzstd = { version = "0.9.1", optional = true }
gltf = { workspace = true, optional = true }
# EXR heightmaps for terrains (`exr`), WebP and TGA texture sources
# (`webp`, `tga`; a glTF's `EXT_texture_webp` images), beside the
# workspace's PNG and JPEG. The cook only: the wasm never decodes these.
image = { workspace = true, optional = true, features = ["exr", "hdr", "webp", "tga"] }
# DDS texture sources (BC1 to BC7 and the uncompressed formats, pure Rust).
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"], optional = true }
# glTF `KHR_draco_mesh_compression`: a pure-Rust Draco decoder, byte
# compatible with Google's (draco 1.5.7); no `unsafe`. The cook only.
draco-core = { version = "2.3.3", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"], optional = true }
meshopt = { version = "0.6.2", optional = true }
mikktspace = { version = "0.3.0", default-features = false, features = ["glam"], optional = true }
fdsm = { version = "0.8.0", optional = true }
fdsm-ttf-parser = { version = "0.2.0", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
hound = { version = "3.5.1", optional = true }
# Compressed sound sources (MP3, Ogg Vorbis, FLAC) decode to PCM at cook
# time, pure Rust; the cook only, never the runtime or the wasm.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "id3v2"], optional = true }
# Ogg Opus sources (`.opus`, and an `.ogg` holding Opus): read with the
# Opus codec og-bundle's `opus` encodes with.
opus-pure = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
nalgebra = { version = "0.34.1", optional = true }
# The cook compiles material shaders for every back end (WGSL in; SPIR-V
# and MSL out), as wgpu would at load.
naga = { version = "30.0.1", optional = true, features = ["wgsl-in", "msl-out", "spv-out", "hlsl-out"] }
# FBX (binary and ASCII, 3000 to 7700) and OBJ with its .mtl, read into a
# glTF binary the model cook takes (`cook/fbx.rs`): ufbx, one C99 file
# compiled by `cc`, MIT or Unlicense. The cook only, never the wasm.
ufbx = { version = "0.11.5", optional = true }

[dev-dependencies]
og-tests = { path = "../og-tests" }
og-ecs = { path = "../og-ecs" }
og-audio = { path = "../og-audio" }
image = { workspace = true }

[[bin]]
name = "og-cook"
path = "src/bin/og-cook.rs"
required-features = ["cook"]

[[test]]
name = "tests"
path = "tests/main.rs"
