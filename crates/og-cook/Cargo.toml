[package]
name = "og-cook"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine cook: assets/ to cooked/ .ogb blobs (meshopt meshes, KTX2 Basis textures, QOA audio, MSDF fonts, scene tables); og-bundle has the runtime loaders that read them."
autotests = false

[features]
default = ["cook", "basis", "transcode"]
# Native Basis Universal transcoding of cooked KTX2 textures to RGBA8 for
# og-render (og-bundle's `transcode`).
transcode = ["og-bundle/transcode"]
# The cook itself (native only): importers, encoders, the incremental manifest.
cook = ["og-bundle/source", "og-core/source", "og-anim/source", "og-render-data/bake", "dep:og-generation", "dep:og-audio", "dep:resvg", "dep:blake3", "dep:og-story", "dep:og-i18n", "og-ai/bake", "og-ai/source", "dep:gltf", "og-render-data/gltf", "dep:image", "dep:image_dds", "dep:draco-core", "dep:meshopt", "dep:mikktspace", "dep:fdsm", "dep:ttf-parser", "dep:skrifa", "dep:hound", "dep:symphonia", "dep:opus-pure", "dep:ruzstd", "dep:serde", "dep:serde_json", "dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_ast_visit", "dep:oxc_parser", "dep:oxc_span", "dep:nalgebra", "dep:og-ui-next", "dep:og-text", "dep:og-rive", "dep:og-css", "dep:og-tween", "dep:naga", "dep:og-records", "og-timeline/import", "dep:og-shape", "dep:og-shape-formats", "dep:og-video", "dep:ufbx", "dep:libm", "dep:og-bake", "dep:oxc_codegen", "dep:oxc_semantic", "dep:oxc_transformer", "dep:rquickjs", "dep:tempfile"]
# Encode textures with the basis-universal crate (a default). Without it the
# cook looks for KTX-Software's `toktx` on PATH.
basis = ["og-bundle/basis", "dep:basis-universal", "dep:ruzstd"]

[dependencies]
# The blob formats and the runtime loaders (re-exported: `og_cook::runtime`, ...).
og-bundle = { path = "../og-bundle" }
og-blob = { path = "../og-blob" }
og-core = { path = "../og-core" }
og-generation = { path = "../og-generation", optional = true, features = ["offline"] }
# SHA-384 for the manifest's Subresource Integrity metadata (a package
# served from another origin, docs/web-export.md §Asset base).
ring = "0.17"
# The cooked data the renderer draws (docs/design.md §2.1, "Formats below
# features"), not the renderer.
og-render-data = { path = "../og-render-data" }
# The UI's vector shapes and paints and the glyph keys (og-draw's, as
# the renderer draws them).
og-draw = { path = "../og-draw" }
og-anim = { path = "../og-anim" }
og-audio = { path = "../og-audio", default-features = false, optional = true }
# Style packs (pack.json) checked against the UI core's class resolver.
og-ui-next = { path = "../og-ui-next", optional = true, features = ["source"] }
# Font files and their glyphs, and Rive files.
og-text = { path = "../og-text", default-features = false, optional = true }
og-rive = { path = "../og-rive", optional = true }
# What og-ui's theme generator (scripts/theme_codegen.rs) reads tokens with:
# a development cook writes the default style from a checkout's tokens.
og-css = { path = "../og-css", optional = true }
og-tween = { path = "../og-tween", optional = true }
og-tilemap = { path = "../og-tilemap" }
# `model { collider true }`: each primitive's triangle-mesh collider baked
# as the physics that loads it builds it (og-physics-data, below og-physics).
og-physics-data = { path = "../og-physics-data" }
# `type model`: the cook builds its parts with og-shape's generators. A
# model's `fracture` block: og-shape cuts the pieces, og-physics-data holds
# the asset (`cook/systems/fracture.rs`).
og-shape = { path = "../og-shape", optional = true }
# A model whose source is an og-shape program is written as a glTF binary
# (`cook/formats/model_program.rs`).
og-shape-formats = { path = "../og-shape-formats", optional = true }
# A streamed file.video: the IVF ffmpeg writes is read into units, and its
# poster is frame 0 as rav1d decodes it (the frame the runtime shows first).
og-video = { path = "../og-video", optional = true }
# Timelines and paths: the cook validates and canonicalises them (importing
# caption files), the runtime parses the canonical text.
og-timeline = { path = "../og-timeline" }
# The cook checks looks against the IDL's records (the reflected resources).
og-records = { path = "../og-records", optional = true }
# A scene's HLOD proxies (cook/systems/hlod.rs): their charts (xatlas) and
# the transfer of their members' look into them. The cook only.
og-bake = { path = "../og-bake", optional = true }
# Navmeshes load into og-ai's nav types; the cook bakes them (og-ai's
# `bake`) and compiles checked behaviour definitions.
og-ai = { path = "../og-ai" }
# Dialogues and quests are validated with og-story's parsers (G2-8).
og-story = { path = "../og-story", optional = true }
# String tables are checked, and shaped scripts found, at cook time.
og-i18n = { path = "../og-i18n", optional = true }
glam = { workspace = true }
bytemuck = { workspace = true }
miniz_oxide = "0.8"
basis-universal = { version = "0.3.1", optional = true }
ruzstd = { version = "0.9.1", optional = true }
gltf = { workspace = true, optional = true }
# EXR heightmaps for terrains (`exr`), WebP and TGA texture sources
# (`webp`, `tga`; a glTF's `EXT_texture_webp` images), animated GIF, WebP
# and APNG flipbook sources (`gif`, `webp`, png's APNG), beside the
# workspace's PNG and JPEG. The cook only: the wasm never decodes these.
image = { workspace = true, optional = true, features = ["exr", "hdr", "webp", "tga", "gif"] }
# DDS texture sources (BC1 to BC7 and the uncompressed formats, pure Rust).
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"], optional = true }
# glTF `KHR_draco_mesh_compression`: a pure-Rust Draco decoder, byte
# compatible with Google's (draco 1.5.7); no `unsafe`. The cook only.
draco-core = { version = "2.3.3", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"], optional = true }
meshopt = { version = "0.6.2", optional = true }
mikktspace = { version = "0.3.0", default-features = false, features = ["glam"], optional = true }
fdsm = { version = "0.8.0", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
# COLR v0 and v1 paint graphs of `font { color true }` (painted by og-ui-next's colr.rs),
# the version og-ui-next paints with.
skrifa = { version = "=0.44.0", default-features = false, features = ["libm"], optional = true }
hound = { version = "3.5.1", optional = true }
# Compressed sound sources (MP3, Ogg Vorbis, FLAC) decode to PCM at cook
# time, pure Rust; the cook only, never the runtime or the wasm.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "id3v2"], optional = true }
# Ogg Opus sources (`.opus`, and an `.ogg` holding Opus): read with the
# Opus codec og-bundle's `opus` encodes with.
opus-pure = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
blake3 = { version = "1.8.7", optional = true }
# Immutable media snapshots shared by planning and ffmpeg jobs; cook only.
tempfile = { version = "3.27", optional = true }
oxc_allocator = { version = "=0.157.0", optional = true }
oxc_ast = { version = "=0.157.0", optional = true }
oxc_ast_visit = { version = "=0.157.0", optional = true }
oxc_parser = { version = "=0.157.0", optional = true }
oxc_span = { version = "=0.157.0", optional = true }
oxc_codegen = { version = "=0.157.0", optional = true }
oxc_semantic = { version = "=0.157.0", optional = true }
oxc_transformer = { version = "=0.157.0", optional = true }
# An isolated ECMAScript realm, with no OS or network bindings, for cook generators.
rquickjs = { version = "=0.14.0", features = ["loader"], optional = true }
nalgebra = { version = "0.34.1", optional = true }
# The cook compiles material shaders for every back end (WGSL in; SPIR-V
# and MSL out), as wgpu would at load.
naga = { version = "30.0.1", optional = true, features = ["wgsl-in", "msl-out", "spv-out", "hlsl-out"] }
# FBX (binary and ASCII, 3000 to 7700) and OBJ with its .mtl, read into a
# glTF binary the model cook takes (`cook/formats/fbx.rs`): ufbx, one C99 file
# compiled by `cc`, MIT or Unlicense. The cook only, never the wasm.
ufbx = { version = "0.11.5", optional = true }
# `type vfx2d`: the Forge renderer's f64 Math, the same on every host
# (never the host's libm).
libm = { version = "0.2.16", optional = true }
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"], optional = true }

[dev-dependencies]
# The GPU test runner (tests/gpu.rs) names og-render's wgpu and probes the
# adapter with pollster.
og-render = { path = "../og-render" }
pollster = { workspace = true }
og-tests = { path = "../og-tests" }
image = { workspace = true }

[[bin]]
name = "og-cook"
path = "src/bin/og-cook.rs"
required-features = ["cook"]

[[test]]
name = "tests"
path = "tests/it/main.rs"
