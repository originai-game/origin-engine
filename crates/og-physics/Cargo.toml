[package]
name = "og-physics"
version = "0.1.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine physics: rapier2d/rapier3d rigid bodies, colliders, contact events and queries as ECS systems"

[features]
default = ["physics2d", "physics3d"]
physics2d = ["dep:rapier2d"]
physics3d = ["dep:rapier3d"]

[dependencies]
og-core = { path = "../og-core" }
og-ecs = { path = "../og-ecs" }
og-lanes = { path = "../og-lanes" }
glam = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3.3"
rapier2d = { version = "0.36.1", default-features = false, features = ["dim2", "f32", "std", "enhanced-determinism", "serde-serialize"], optional = true }
rapier3d = { version = "0.36.1", default-features = false, features = ["dim3", "f32", "std", "enhanced-determinism", "serde-serialize"], optional = true }

# Natively and in the lanes wasm (+atomics: rayon on wasm-bindgen-rayon's
# Workers) the step runs on the lanes pool (og_lanes::install): rapier's
# `parallel` build computes bit for bit what its sequential build does under
# `enhanced-determinism` (its tests/parallel_path_parity.rs) on any number of
# threads (tests/thread_count_determinism.rs), which the wasm determinism
# step checks against the single-threaded wasm, the one build without it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rapier2d = { version = "0.36.1", default-features = false, features = ["parallel"], optional = true }
rapier3d = { version = "0.36.1", default-features = false, features = ["parallel"], optional = true }

[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
rapier2d = { version = "0.36.1", default-features = false, features = ["parallel"], optional = true }
rapier3d = { version = "0.36.1", default-features = false, features = ["parallel"], optional = true }

[dev-dependencies]
# tests/platformer_ground.rs: a floor of tilemap collision rectangles.
og-tilemap = { path = "../og-tilemap" }
# tests/lanes.rs: which pool a thread belongs to after a query.
rayon = "1.12.0"
