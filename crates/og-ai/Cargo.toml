[package]
autotests = false
name = "og-ai"
version = "0.9.0+dev.20261128.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine navigation and AI: grid A* and jump point search, flow fields, tiled navmeshes, steering and the og.nav agent system; checked native behaviour trees and state machines, perception, blackboards and deterministic snapshot-covered AI."

# Pure Rust over og-core and og-ecs; builds for wasm32-unknown-unknown.
# `bake` adds the voxeliser (triangles to the walkable heightfield) that
# og-cook runs at cook time; the runtime and the wasm never build it.
[dependencies]
og-core = { path = "../og-core" }
og-ecs = { path = "../og-ecs" }
# A cooked navmesh decodes into the nav types (`nav::cooked`); the blob
# schema is og-bundle's.
og-bundle = { path = "../og-bundle" }
# The state blocks' per-entity forms (`StateBlock::form`) are JSON values.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3.3"

[features]
default = []
bake = []
source = ["og-core/source"]

[dev-dependencies]
# The nav_costs example bakes levels, so it builds the voxeliser.
og-ai = { path = ".", features = ["bake"] }

[[test]]
name = "tests"
path = "tests/it/main.rs"
