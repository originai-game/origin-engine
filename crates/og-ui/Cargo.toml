[package]
name = "og-ui"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine UI: an immediate-mode toolkit with Clay-style layout, themed by the platform design tokens, drawn through og-render's sprite and text batches, addressable by the probe."

[dependencies]
og-core = { path = "../og-core" }
og-ecs = { path = "../og-ecs" }
og-input = { path = "../og-input" }
og-render = { path = "../og-render" }
og-probe = { path = "../og-probe", default-features = false }
# Localization: text direction and shaped scripts (og-i18n), shaping (rustybuzz).
og-i18n = { path = "../og-i18n" }
rustybuzz = "0.20.1"

[dev-dependencies]
serde_json = "1"
image = { workspace = true }

# The theme generator (scripts/gen-theme.sh runs it).
[[example]]
name = "gen-theme"
path = "scripts/gen_theme.rs"
