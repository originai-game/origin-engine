[package]
name = "og-ui"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine UI: an immediate-mode toolkit with Clay-style layout, styled by each game's own UI style, drawn through og-render's sprite and text batches, addressable by the probe."
autotests = false

[features]
default = ["shaping"]
kit-tests = []
# Run-time shaping with HarfRust: Arabic joining, Indic clusters and
# conjuncts, marks placed by the font's GPOS. Without it a shaped script is
# drawn unshaped (its characters in visual order); bidi, kerning and run-time
# glyphs stay. og-runtime and og-host-web pass it on (`shaping`).
shaping = ["dep:harfrust", "dep:parley"]

[dependencies]
og-core = { path = "../og-core" }
og-ecs = { path = "../og-ecs" }
og-input = { path = "../og-input" }
og-render = { path = "../og-render" }
og-probe = { path = "../og-probe", default-features = false }
# The damped spring the skin's hover and press move on.
og-tween = { path = "../og-tween" }
# World-space UI's state: mass instances as bytes (src/world.rs).
bytemuck = { workspace = true }
# Localization: text direction and shaped scripts (og-i18n).
og-i18n = { path = "../og-i18n" }
# Match Parley 0.12's font stack; libm, never host floating-point math.
harfrust = { version = "=0.12.0", optional = true, default-features = false, features = ["libm"] }
skrifa = { version = "=0.44.0", default-features = false, features = ["libm"] }
parley = { version = "=0.12.0", optional = true, default-features = false, features = ["libm", "complex-scripts"] }
parley_engine = { version = "=0.12.0", default-features = false, features = ["libm", "complex-scripts"] }
# The bidirectional algorithm (UAX #9): a line's runs in visual order.
unicode-bidi = "0.3.18"
# A cooked font's file (`runtime true`): metrics and outlines of characters
# outside the atlas, rendered at run time (src/glyphs.rs).
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
# Viewmodels and bindings (src/bind.rs) are JSON, as the host passes them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit = { version = "=0.25.2", features = ["serde"] }

[dev-dependencies]
image = { workspace = true }
# The reference-frame rule (og_tests::compare::tolerance_for).
og-tests = { path = "../og-tests" }
pollster = { workspace = true }

[[test]]
name = "style-packs"
path = "../../templates/styles/tests/packs.rs"
required-features = ["kit-tests"]

# The default style's generator (scripts/gen-theme.sh runs it).
[[example]]
name = "gen-theme"
path = "scripts/gen_theme.rs"

[[test]]
name = "tests"
path = "tests/it/main.rs"
