[package]
name = "og-host-node"
version = "0.7.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine native host: the binding symbols as a napi addon (origin-engine.node), headless, rendering offscreen."

[lib]
crate-type = ["cdylib"]
# The addon resolves napi_* from the JavaScript runtime that loads it; a test
# harness binary would have nothing to resolve them against. Its tests are
# the TypeScript suite in packages/engine (bun run test).
test = false
doctest = false

[features]
default = []
# A published game: the commands module and the probe's non-player members are not exported.
publish = ["og-runtime/publish"]
# Audio on the default output device through cpal (og-audio); without it the sinks are null and capture.
native-audio = ["dep:cpal"]

[dependencies]
og-api = { path = "../og-api" }
og-runtime = { path = "../og-runtime" }
# Not called here: og-physics' `default` (both profiles, which og-runtime's
# default features turn on anyway) is what the workspace's test build
# selects for it as a member, so asking for it here gives og and the addon
# the tests' build of og-physics and og-runtime instead of a second one
# (docs/ci.md §Test binaries). The addon is native and ships both profiles.
og-physics = { path = "../og-physics" }
og-render = { path = "../og-render" }
og-probe = { path = "../og-probe", features = ["ws"] }
og-cook = { path = "../og-cook", default-features = false, features = ["transcode"] }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
pollster = { workspace = true }
serde_json = "1"
og-audio = { path = "../og-audio" }
og-net = { path = "../og-net", features = ["ws"] }
cpal = { version = "0.17.1", optional = true }

[build-dependencies]
napi-build = "2"
