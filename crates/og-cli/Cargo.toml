[package]
autotests = false
name = "og-cli"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine: the `og` tool (build, run, cook, probe, test, dev, doctor)"

[[bin]]
name = "og"
path = "src/main.rs"

[dependencies]
og-anim = { path = "../og-anim" }
og-api = { path = "../og-api" }
og-idl = { path = "../og-idl" }
og-i18n = { path = "../og-i18n" }
og-core = { path = "../og-core" }
og-cook = { path = "../og-cook" }
og-bake = { path = "../og-bake" }
og-render = { path = "../og-render" }
# `og check`'s material shader findings (og_render_data::reach).
og-render-data = { path = "../og-render-data", features = ["reach"] }
glam = { workspace = true }
og-net = { path = "../og-net", features = ["ws"] }
image = { workspace = true }
gltf = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
# `og style pack` starts a new style from the prototype's palette and radii.
og-ui = { path = "../og-ui" }
# og style check reads a pack's declaration values (style/literals.rs).
cssparser = "0.38.0"
# og compare's FLIP and the agents' captures (og-probe's frame module).
og-probe = { path = "../og-probe", default-features = false }
# `og check`'s module-scope state check (src/module_state.rs), at og-cook's versions.
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_semantic = "=0.157.0"
oxc_span = "=0.157.0"

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "tests"
path = "tests/it/main.rs"
