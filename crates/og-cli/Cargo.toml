[package]
name = "og-cli"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine: the `og` tool (build, run, cook, probe, test, dev, doctor)"

[[bin]]
name = "og"
path = "src/main.rs"

[dependencies]
og-api = { path = "../og-api" }
og-idl = { path = "../og-idl" }
og-core = { path = "../og-core" }
og-cook = { path = "../og-cook" }
og-bake = { path = "../og-bake" }
og-render = { path = "../og-render" }
glam = { workspace = true }
og-net = { path = "../og-net", features = ["ws"] }
image = { workspace = true }
serde_json = "1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
og-ui = { path = "../og-ui" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
