[package]
name = "og-cli"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine: the `og` tool (build, run, cook, probe, test, dev, doctor)"

[[bin]]
name = "og"
path = "src/main.rs"

[dependencies]
og-api = { path = "../og-api" }
og-idl = { path = "../og-idl" }
og-core = { path = "../og-core" }
og-cook = { path = "../og-cook" }
image = { workspace = true }
serde_json = "1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
og-ui = { path = "../og-ui" }
