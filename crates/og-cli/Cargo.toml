[package]
autotests = false
name = "og-cli"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine: the `og` tool (build, run, cook, probe, test, dev, doctor)"

[[bin]]
name = "og"
path = "src/main.rs"

[dependencies]
og-anim = { path = "../og-anim" }
og-api = { path = "../og-api" }
og-idl = { path = "../og-idl" }
og-i18n = { path = "../og-i18n" }
og-core = { path = "../og-core" }
og-cook = { path = "../og-cook" }
# `og model`: the kernel and its file formats.
og-shape = { path = "../og-shape" }
og-shape-formats = { path = "../og-shape-formats" }
og-bake = { path = "../og-bake" }
og-env = { path = "../og-env" }
og-render = { path = "../og-render" }
# `og check`'s material shader findings (og_render_data::reach).
og-render-data = { path = "../og-render-data", features = ["reach"] }
glam = { workspace = true }
og-net = { path = "../og-net", features = ["ws"] }
# `og world-server` and its load test (docs/design.md §2.12).
og-shared = { path = "../og-shared", features = ["server"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "signal", "time"] }
image = { workspace = true }
gltf = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
# `og style pack` starts a new style from the prototype's palette and radii.
# `og check`'s class check over a game's TSX.
og-ui-next = { path = "../og-ui-next" }
nsh-jsx = { path = "../../third_party/nsh-jsx" }
# og compare's FLIP and the agents' captures (og-probe's frame module).
og-probe = { path = "../og-probe", default-features = false }
# `og check`'s module-scope state check (src/module_state.rs), at og-cook's versions.
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_semantic = "=0.157.0"
oxc_span = "=0.157.0"

[dev-dependencies]
hound = "3.5.1"
og-timeline = { path = "../og-timeline" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# og run's Job object: the game process dies with og.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[test]]
name = "tests"
path = "tests/it/main.rs"
