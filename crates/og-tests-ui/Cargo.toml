[package]
name = "og-tests-ui"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine tests that draw og-ui: the frames og-render makes of the commands og-ui built, against `references/`, apart so that og-ui's own tests do not build on og-render."
publish = false
autotests = false

[lib]
doctest = false

[dev-dependencies]
og-ui = { path = "../og-ui" }
# The tests draw what the UI built.
og-render = { path = "../og-render" }
# og-ui's test support (crates/og-ui/tests/support, included by path) names
# the handles and the glyph table.
og-draw = { path = "../og-draw" }
og-core = { path = "../og-core" }
og-input = { path = "../og-input" }
og-i18n = { path = "../og-i18n" }
# The reference-frame rule (og_tests::compare::tolerance_for).
og-tests = { path = "../og-tests" }
image = { workspace = true }
pollster = { workspace = true }
serde_json = "1"

[[test]]
name = "tests"
path = "tests/it/main.rs"
