[package]
name = "og-text"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine text: measurement, line breaking, bidi and shaping over cooked MSDF fonts and their font files, and run-time glyphs; og-ui lays out and draws with it."

[dependencies]
og-core = { path = "../og-core" }
# The glyph atlas text's glyphs are put into.
og-draw = { path = "../og-draw" }
# Localization: text direction and shaped scripts (og-i18n).
og-i18n = { path = "../og-i18n" }
# Match Parley 0.12's font stack; libm, never host floating-point math.
skrifa = { version = "=0.44.0", default-features = false, features = ["libm"] }
# Parley lays out shaped paragraphs and every edited text (its cursor and
# selection place the caret, with or without `shaping`).
parley = { version = "=0.12.0", default-features = false, features = ["libm"] }
parley_engine = { version = "=0.12.0", default-features = false, features = ["libm"] }
# Emoji and Emoji_Presentation (CSS `font-variant-emoji`), as Parley reads
# them.
parley_data = { version = "=0.12.0", default-features = false, features = ["baked"] }
# A glyph's coverage: font-rs's exact-area accumulation fill, as
# published, default features (no `sse` C build), so native and wasm fill
# the same bytes (src/raster.rs is its adapter).
font-rs = "=0.1.3"
# A glyph's outline stroke (`-webkit-text-stroke`): kurbo's stroker, with
# libm's maths so native and wasm stroke alike (as og-draw takes it).
kurbo = { version = "0.13.1", default-features = false, features = ["libm"] }
# A shadow's Gaussian (src/raster.rs `blur`): the same exp on both hosts.
libm = "0.2.16"
# Distance fields of glyph outlines (world, scaled and effect text), and the
# shapes the overlap removal works on (vendored: libm's maths).
fdsm = "0.8.0"
# fdsm's transforms, at fdsm's version.
nalgebra = "0.34.1"
# fdsm's field images, at fdsm's version, no codecs.
image = { version = "0.25.6", default-features = false }
# Colour glyphs' paint graphs painted (vendored: exact reciprocals); no PNG.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
# A pixel font's outlines on its grid (src/glyphs.rs).
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "variable-fonts"] }
