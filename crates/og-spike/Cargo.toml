[package]
name = "og-spike"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Origin Engine spike: a wgpu PBR renderer with shadows and IBL, native headless and web."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { workspace = true }
glam = { workspace = true }
gltf = { workspace = true }
image = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["metal", "vulkan"] }
pollster = { workspace = true }
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["OffscreenCanvas", "console", "Performance", "WorkerGlobalScope"] }
console_error_panic_hook = "0.1"
console_log = "1"

[[bin]]
name = "og-spike"
path = "src/main.rs"
required-features = []
