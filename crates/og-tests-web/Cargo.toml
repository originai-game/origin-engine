[package]
name = "og-tests-web"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine tests in the browser: og-tests' gfx scenes and og-ui's reference scenes as a wasm-bindgen module rendered on WebGPU or WebGL2 (packages/engine/tests/web/reference-gfx.ts)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Natively the crate is empty: the native harness is og-tests itself.
[target.'cfg(target_arch = "wasm32")'.dependencies]
og-tests = { path = "../og-tests" }
og-render = { path = "../og-render", features = ["gltf"] }
# og-ui's reference scenes (crates/og-ui/tests/support/scenes.rs, included by path).
og-ui = { path = "../og-ui" }
# og-ui's cooked-font text frames (crates/og-ui/tests/support/text_scenes.rs):
# the fonts' blobs decoded with og-cook's loaders, the scenes' direction and
# typed text.
og-cook = { path = "../og-cook", default-features = false, features = ["runtime"] }
og-i18n = { path = "../og-i18n" }
og-input = { path = "../og-input" }
og-core = { path = "../og-core" }
image = { workspace = true }
serde_json = "1"
wgpu = { workspace = true }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["OffscreenCanvas", "console"] }
