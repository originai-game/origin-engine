[package]
name = "og-tests-web"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine tests in the browser: og-tests' gfx scenes as a wasm-bindgen module rendered on WebGPU or WebGL2 (packages/engine/tests/web/reference-gfx.ts)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Natively the crate is empty: the native harness is og-tests itself.
[target.'cfg(target_arch = "wasm32")'.dependencies]
og-tests = { path = "../og-tests" }
og-render = { path = "../og-render", features = ["gltf"] }
wgpu = { workspace = true }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["OffscreenCanvas"] }
