[package]
name = "og-tests"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine tests: the gfx reference harness (scenes rendered headless, compared with committed frames)."
publish = false

[dependencies]
og-render = { path = "../og-render", features = ["gltf", "bake"] }
og-core = { path = "../og-core" }
og-tilemap = { path = "../og-tilemap" }
glam = { workspace = true }
# hdr: the environment-map scene's equirectangular image (assets/env).
image = { workspace = true, features = ["hdr"] }

[[bin]]
name = "og-gfx"
path = "src/bin/og-gfx.rs"
