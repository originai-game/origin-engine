[package]
name = "og-tests"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine tests: the gfx reference harness (scenes rendered headless, compared with committed frames)."
publish = false

[dependencies]
og-render = { path = "../og-render", features = ["gltf", "bake"] }
og-core = { path = "../og-core" }
og-tilemap = { path = "../og-tilemap" }
glam = { workspace = true }
# hdr: the environment-map scene's equirectangular image (assets/env).
image = { workspace = true, features = ["hdr"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# vox_scenes: a .vox cooked into a project of its own and played as a game
# loads it (the cook is native only; the scene is not in the browser's set).
og-cook = { path = "../og-cook" }
og-anim = { path = "../og-anim" }

[[bin]]
name = "og-gfx"
path = "src/bin/og-gfx.rs"
