[package]
name = "og-tests"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine tests: the gfx reference harness (scenes rendered headless, compared with committed frames)."
publish = false
autotests = false

[features]
# Real-window acceptance only; never part of headless reference runs or wasm.
surface = ["dep:winit", "dep:pollster"]

[dependencies]
og-render = { path = "../og-render", features = ["gltf", "bake"] }
og-core = { path = "../og-core" }
og-geom = { path = "../og-geom" }
og-tilemap = { path = "../og-tilemap" }
glam = { workspace = true }
# hdr: the environment-map scene's equirectangular image (assets/env).
image = { workspace = true, features = ["hdr"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
og-anim = { path = "../og-anim" }
# light_scenes: the Cornell box baked by og-bake as the scene is built.
og-bake = { path = "../og-bake" }
pollster = { workspace = true, optional = true }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06", "x11"], optional = true }

[[example]]
name = "surface"
required-features = ["surface"]

[[test]]
name = "tests"
path = "tests/main.rs"

[[test]]
name = "render"
path = "tests/render.rs"
