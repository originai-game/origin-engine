[package]
name = "og-render"
version = "0.6.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine renderer: wgpu forward PBR with shadows, IBL, sky and post, native headless and web."
autotests = false

[features]
default = []
# glTF 2.0 (.glb/.gltf) import into RenderScene meshes, materials and textures.
# A bridge until the cook (M4) produces .ogb meshes; the runtime wasm leaves it off.
gltf = ["dep:gltf"]
# Prefiltering equirectangular HDR images into environment maps on the CPU
# (environment::bake): the cook's, never the runtime wasm's.
bake = []
# A published game (og-host-web's `publish`): no GPU pass timing, so the
# timestamp queries, their resolves and readbacks are not built in
# (timing.rs); the CPU's pass timings stay.
publish = []
# The 2D profile's renderer (og-host-web's 2D web modules): the 3D world
# subsystems (terrain, planar water, 3D fluids, scattered copies,
# volumetric fog) are not drawn and their shaders are not built in
# (`WORLD_3D`, RenderCapabilities.world3d).
profile2d = []

[dependencies]
# Reflection: StandardMaterial's schema is og-core's.
og-core = { path = "../og-core" }
og-lanes = { path = "../og-lanes" }
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
# The capture's PNG (capture.rs `png`): image-rs's deflate for filtered
# image rows.
fdeflate = "0.3.7"
gltf = { workspace = true, optional = true }

[dev-dependencies]
# tests/webgl2.rs: the WGSL to GLSL ES 3.0 translation wgpu's GL backend runs
# in the browser (wgpu's own naga, with the GLSL writer); tests/shaders.rs:
# every module translated as the Metal, Vulkan and DX12 backends do.
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out", "msl-out", "spv-out", "hlsl-out"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["metal", "vulkan", "dx12"] }
pollster = { workspace = true }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64", target_env = "msvc"))'.dependencies]
# Ship the shader compiler inside the native host: no FXC fallback or DLL install.
wgpu = { workspace = true, features = ["static-dxc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[[test]]
name = "tests"
path = "tests/main.rs"
