[package]
autotests = false
name = "og-story"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine dialogue and quests as data: dialogue graphs and quests from .ogt (lines as og.i18n keys, choices with conditions and checks, variables, weighted picks), validated at cook, and the story state a world saves: variables, conversations, quests, read lines, deterministic on og.Rng."

# Pure Rust over og-core; builds for wasm32-unknown-unknown.
[dependencies]
og-core = { path = "../og-core" }

[[test]]
name = "tests"
path = "tests/it/main.rs"
