[package]
name = "og-geom"
version = "0.7.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine procedural geometry: three.js's shape, extrude, lathe and polyhedron generators, swept sections, merges and CSG, deterministic on every host, with no renderer dependency"

[dependencies]
glam = { workspace = true }
# The engine's one stable sort (og_core::sort).
og-core = { path = "../og-core" }
# Exact orientation predicates (Shewchuk's), where CSG decides a side.
robust = "1.2.0"
# The constrained Delaunay triangulation CSG cuts each triangle with
# (already in the build through parry).
spade = "2.15.1"
