[package]
autotests = false
name = "og-bake"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine light baking: lightmap UVs from xatlas, a progressive CPU path tracer for lightmaps and spherical-harmonic light volumes (og bake lightmaps). Native only, no GPU."

[dependencies]
# The triangle BVH's build and ray tests.
og-core = { path = "../og-core" }
glam = { workspace = true }

[build-dependencies]
cc = "1.0"

[[test]]
name = "tests"
path = "tests/it/main.rs"
