[package]
name = "og-tests-cooked"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine tests that cook a project: og-tests' gfx scenes made by og-cook and og-ui's cooked-font frames, apart so that og-tests and og-ui do not build on og-cook."
publish = false
autotests = false

[features]
kit-tests = []

[dependencies]
og-tests = { path = "../og-tests" }
og-render = { path = "../og-render" }
og-cook = { path = "../og-cook" }
og-anim = { path = "../og-anim" }
# ui-rive plays its converted artboards with og-ui's Rive player.
og-ui = { path = "../og-ui" }
glam = { workspace = true }
# gltf_scenes writes its glTFs' JSON.
serde_json = "1"

# og-ui's tests that cook (tests/text_gfx.rs, materials_gfx.rs,
# pack_contrast.rs) and og-ui's test support they include by path.
[dev-dependencies]
pollster = { workspace = true }
# tests/support/text_scenes.rs reads the cooked fonts with og-bundle's loaders
# (og-tests-web includes it by path, without og-cook).
og-bundle = { path = "../og-bundle" }
og-core = { path = "../og-core" }
og-input = { path = "../og-input" }
og-i18n = { path = "../og-i18n" }
image = { workspace = true }

[[bin]]
name = "og-gfx"
path = "src/bin/og-gfx.rs"

[[test]]
name = "tests"
path = "tests/it/main.rs"

[[test]]
name = "style-diagnostics"
path = "../../templates/styles/tests/contrast.rs"
required-features = ["kit-tests"]
