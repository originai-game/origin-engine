[package]
name = "og-tests-cooked"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine tests that cook a project: og-tests' gfx scenes made by og-cook, apart so that og-tests does not build on og-cook."
publish = false
autotests = false

[features]

[dependencies]
og-tests = { path = "../og-tests" }
og-render = { path = "../og-render" }
og-cook = { path = "../og-cook" }
og-anim = { path = "../og-anim" }
# plant-scatter-autumn's leaf year.
og-env = { path = "../og-env" }
# ui-rive plays its converted artboards with og-rive's player.
og-rive = { path = "../og-rive" }
# Its texts lay out in og-text's collection of faces.
og-text = { path = "../og-text", default-features = false }
glam = { workspace = true }
# gltf_scenes writes its glTFs' JSON.
serde_json = "1"

[dev-dependencies]
pollster = { workspace = true }
image = { workspace = true }

[[bin]]
name = "og-gfx"
path = "src/bin/og-gfx.rs"

[[test]]
name = "tests"
path = "tests/it/main.rs"
