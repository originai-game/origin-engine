[package]
name = "og-tween"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine tweens: eased, delayed, looping and grouped animation of any reflected numeric component field, as one deterministic ECS system with a state block"

[dependencies]
og-core = { path = "../og-core" }
og-ecs = { path = "../og-ecs" }
# The state block's per-entity form (`StateBlock::form`) holds JSON values.
serde_json = "1"
