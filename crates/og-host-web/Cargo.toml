[package]
name = "og-host-web"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine web host: the binding symbols as a wasm-bindgen module over the world and the renderer, run in a Worker on an OffscreenCanvas."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["shaping", "physics2d", "physics3d"]
# og-ui's run-time shaping (rustybuzz: Arabic, Indic); every shipped variant
# keeps it (scripts/wasm-crates.txt); a build without it is for games
# without shaped scripts (crates/og-ui/README.md §Text).
shaping = ["og-runtime/shaping"]
# A published game: the commands module and the probe's non-player members are not exported.
publish = ["og-runtime/publish"]
# The physics profiles built in. The dev module and the lanes variant have
# both; the publish variants one each, by the game's profile (`og build
# --publish` ships the 3D or the 2D one; scripts/wasm-crates.txt `variant`).
physics2d = ["og-runtime/physics2d"]
physics3d = ["og-runtime/physics3d"]
# The 2D profile's renderer: terrain, planar water, 3D fluids, scattered
# copies and volumetric fog are not built in (og-render's `profile2d`,
# RenderCapabilities.world3d false), nor og-runtime's terrain (its calls
# answer the refusal naming world3d). The 2D publish and lanes modules
# have it (scripts/wasm-crates.txt).
profile2d = ["og-runtime/profile2d"]

[dependencies]
og-api = { path = "../og-api" }
og-core = { path = "../og-core" }
og-runtime = { path = "../og-runtime", default-features = false }
og-lanes = { path = "../og-lanes" }
og-render = { path = "../og-render" }
og-probe = { path = "../og-probe", default-features = false }
og-cook = { path = "../og-cook", default-features = false, features = ["runtime"] }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
og-audio = { path = "../og-audio" }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true }
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["OffscreenCanvas"] }
# No logger is installed in the web module (nothing calls log::set_logger),
# so every log macro of wgpu, naga and og-render discards its record at run
# time; off at compile time, their formatting (wgpu-core's and naga's Debug
# impls) is not built in (tests/evidence/r4/size-3). A wasm32-only feature:
# native builds keep the log crate as it is.
log = { workspace = true, features = ["max_level_off"] }
