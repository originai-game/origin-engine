[package]
name = "og-shape"
version = "0.9.0+dev.20261128.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine modeling kernel: profiles, named generators, exact booleans, edits, bevels, skins, models as programs, and the mesh tools (repair, decimate, unwrap, bake, collide, measure, preview), deterministic in f64 on every host"
autotests = false
autoexamples = false

[dependencies]
glam = { workspace = true }
# plant's seeded randomness and f32 angles (og_core::rng, og_core::math).
og-core = { path = "../og-core" }
robust = "1.2.0"
sha2 = "0.11"
spade = "2.15.1"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout", "glyph-names"] }
i_overlay = { version = "9.1.0", default-features = false }
# float_roundtrip: a program's numbers parse correctly rounded in every
# build. Without it the kernel's parse depended on whether another crate in
# the build (og-net, og-runtime) turned it on, so a golden moved by an ulp
# between a `-p` build and a workspace build.
serde_json = { version = "1.0.154", default-features = false, features = ["std", "float_roundtrip"] }

[dev-dependencies]
# The integration tests read and write files (a test edge, not a layer edge).
og-shape-formats = { path = "../og-shape-formats" }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }

# The determinism lint (clippy.toml beside this file).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
float_cmp = "allow"

[[test]]
name = "tests"
path = "tests/it/main.rs"

[[example]]
name = "bevel_phase3"
path = "examples/bevel_phase3.rs"

[[example]]
name = "bevel_scan"
path = "examples/bevel_scan.rs"

[[example]]
name = "edit_sweep"
path = "examples/edit_sweep.rs"

[[example]]
name = "model_report"
path = "examples/model_report.rs"

[[example]]
name = "shell_sweep"
path = "examples/shell_sweep.rs"
