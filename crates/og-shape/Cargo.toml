[package]
name = "og-shape"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine modeling kernel: profiles, named generators, exact booleans, edits, bevels, skins, models as programs, and the mesh tools (repair, decimate, unwrap, bake, collide, measure, preview), deterministic in f64 on every host"
autotests = false
autoexamples = false

[dependencies]
glam = { workspace = true }
libm = "0.2.16"
robust = "1.2.0"
sha2 = "0.11"
spade = "2.15.1"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "opentype-layout", "glyph-names"] }
i_overlay = { version = "9.1.0", default-features = false }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
image-webp = "0.2.4"

[dev-dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }

# The determinism lint (clippy.toml beside this file).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
float_cmp = "allow"

