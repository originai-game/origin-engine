[package]
name = "og-shared"
version = "0.8.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine shared worlds (docs/design.md §2.12): the protocol, the interest grid, movement rules, token verifiers, `og world-server` and the load test's bots."

[dependencies]
og-core = { path = "../og-core" }
serde_json = "1"
# Token signatures (HS256, EdDSA, ES256): the crypto the engine already ships.
ring = "0.17"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A tick's clients run on a persistent work-stealing pool (the engine's lanes use the same).
rayon = "1.12"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# A JWKS document named by URL (`--jwks https://...`), on rustls as og-net's HTTP client.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
