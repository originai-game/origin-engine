[package]
name = "og-shared"
version = "0.9.0+dev.20261128.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine shared worlds (docs/design.md §2.12): the protocol, the interest grid, movement rules, token verifiers, `og world-server` and the load test's bots."

[features]
# The server half: `og world-server`, its shard, verifiers, config and the
# load bots. Without it the crate is the protocol and a client's view, all an
# engine needs (the runtime builds for wasm and in the native addon).
# A native client's connection (og-host-node's `og run --shared`).
client = ["dep:web-transport-quinn", "dep:url", "dep:tokio", "dep:tungstenite", "dep:rustls", "dep:webpki-roots"]
server = ["dep:web-transport-quinn", "dep:quinn-proto", "dep:rcgen", "dep:url", "dep:og-core", "dep:serde_json", "dep:ring", "dep:rayon", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:ureq"]

[dependencies]
og-core = { path = "../og-core", optional = true }
serde_json = { version = "1", optional = true }
# Token signatures (HS256, EdDSA, ES256): the crypto the engine already ships.
ring = { version = "0.17", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A tick's clients run on a persistent work-stealing pool (the engine's lanes use the same).
rayon = { version = "1.12", optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"], optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
# The client's WebSocket and its TLS: the versions og-net's relay client pins.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }
webpki-roots = { version = "1", optional = true }
# WebTransport (docs/design.md §2.12): datagrams for state, a stream for the rest.
web-transport-quinn = { version = "0.13", default-features = false, features = ["ring"], optional = true }
# The server's 4-byte connection ids (quinn does not re-export the generator).
quinn-proto = { version = "0.11", default-features = false, optional = true }
url = { version = "2", optional = true }
# `og world-server cert`: a short-lived self-signed certificate a browser takes by its hash.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"], optional = true }
# A JWKS document named by URL (`--jwks https://...`), on rustls as og-net's HTTP client.
ureq = { version = "3.5", default-features = false, features = ["rustls"], optional = true }
