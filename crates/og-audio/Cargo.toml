[package]
name = "og-audio"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine audio: the tick-side command stream (sources, listener, buses, events) and the mixer that renders it outside the tick (QOA streaming, loops, pitch, spatialisation, soft limiter)."
autotests = false

# Pure Rust, no renderer: builds for wasm32-unknown-unknown
# (`cargo check --target wasm32-unknown-unknown -p og-audio`). The QOA and
# Opus codecs are og-bundle's own source files (src/lib.rs `mod qoa`, `mod
# opus`), compiled here so audio does not depend on og-bundle's og-render
# dependency.
[dependencies]
og-core = { path = "../og-core" }
og-ecs = { path = "../og-ecs" }
# Opus sounds' blocks decode with og-bundle's `src/opus.rs`, compiled here
# by path (`og_audio::opus`), over this codec (pure Rust, no dependencies).
opus-pure = { workspace = true }

[dev-dependencies]
image = { workspace = true }

[[test]]
name = "tests"
path = "tests/main.rs"

[[test]]
name = "audio"
path = "tests/audio.rs"
