[package]
name = "og-ui-fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fuzz targets for og-ui's untrusted inputs: a document's text (its markup, expressions and CSS) from parse to built frames. Run with `cargo fuzz run --fuzz-dir crates/og-ui-fuzz document` (docs/ci.md §Fuzzing)."
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
og-ui = { path = "../og-ui" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "document"
path = "fuzz_targets/document.rs"
test = false
doc = false
bench = false
