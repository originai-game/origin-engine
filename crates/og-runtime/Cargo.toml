[package]
name = "og-runtime"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine runtime: the host-neutral implementation of the API that og-host-web and og-host-node wrap."

[dependencies]
og-api = { path = "../og-api" }
og-core = { path = "../og-core" }
og-ecs = { path = "../og-ecs" }
og-render = { path = "../og-render" }
og-geom = { path = "../og-geom" }
og-probe = { path = "../og-probe", default-features = false }
og-cook = { path = "../og-cook", default-features = false, features = ["runtime"] }
miniz_oxide = "0.8"
glam = { workspace = true }
serde_json = { version = "1", features = ["float_roundtrip"] }
og-physics = { path = "../og-physics", default-features = false }
og-audio = { path = "../og-audio" }
og-ui = { path = "../og-ui", default-features = false }
og-input = { path = "../og-input" }
og-anim = { path = "../og-anim" }
og-timeline = { path = "../og-timeline" }
og-lanes = { path = "../og-lanes" }
og-tween = { path = "../og-tween" }
og-tilemap = { path = "../og-tilemap" }
og-nav = { path = "../og-nav" }
og-ai = { path = "../og-ai" }
og-i18n = { path = "../og-i18n" }
og-net = { path = "../og-net" }

[features]
default = ["shaping", "physics2d", "physics3d"]
# A published game: the probe keeps only its player-facing members and
# the renderer times no pass on the GPU (og-render's `publish`).
publish = ["og-probe/publish", "og-render/publish"]
# The 2D profile: the renderer without the 3D world subsystems (og-render's
# `profile2d`) and the runtime without terrain (src/terrain_absent.rs: its
# calls and height-field colliders answer the refusal); the 2D web modules,
# docs/web-export.md §Variants.
profile2d = ["og-render/profile2d"]
# og-ui's run-time shaping (rustybuzz: Arabic, Indic and the other shaped
# scripts). A build for games without them can leave it out.
shaping = ["og-ui/shaping"]
# The physics profiles built in (og-physics): both by default; a shipping
# web variant keeps the one its game's profile uses (docs/web-export.md
# §Variants), and the other profile's calls answer that it is not built.
physics2d = ["og-physics/physics2d"]
physics3d = ["og-physics/physics3d"]

[dev-dependencies]
# tests/stream_release.rs cooks a small project with streaming groups.
og-cook = { path = "../og-cook" }
