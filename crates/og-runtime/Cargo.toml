[package]
name = "og-runtime"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine runtime: the host-neutral implementation of the API that og-host-web and og-host-node wrap."
autotests = false

[dependencies]
og-api = { path = "../og-api" }
og-core = { path = "../og-core" }
og-env = { path = "../og-env" }
og-ecs = { path = "../og-ecs" }
og-render = { path = "../og-render" }
og-geom = { path = "../og-geom" }
og-probe = { path = "../og-probe", default-features = false }
og-bundle = { path = "../og-bundle" }
miniz_oxide = "0.8"
glam = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Shortest float formatting (serde_json's own): a system call's time payload.
zmij = "1"
og-physics = { path = "../og-physics", default-features = false }
og-audio = { path = "../og-audio" }
og-ui = { path = "../og-ui", default-features = false }
# The reactive session and its wire format, which the new core's stores use.
og-reactive = { path = "../og-reactive" }
# og-ui's new core: every document runs on it.
og-ui-model = { path = "../og-ui-model" }
og-ui-next = { path = "../og-ui-next" }
og-css = { path = "../og-css" }
og-input = { path = "../og-input" }
# og.motion's model runs on wgpu (og-anim's `motion`).
og-anim = { path = "../og-anim", features = ["motion"] }
og-timeline = { path = "../og-timeline" }
og-lanes = { path = "../og-lanes" }
og-tween = { path = "../og-tween" }
og-tilemap = { path = "../og-tilemap" }
og-ai = { path = "../og-ai" }
og-story = { path = "../og-story" }
og-i18n = { path = "../og-i18n" }
og-net = { path = "../og-net" }
# Shared worlds' protocol and a client's view (no server: its `server` feature is og world-server's).
og-shared = { path = "../og-shared" }
# Streamed video's decode plan; natively its rav1d decoder too (below).
og-video = { path = "../og-video", default-features = false }
bincode = "1.3.3"

# og.load.imageData's decoder natively (PNG and JPEG, on a worker thread),
# and og.load.environmentData's OpenEXR (`exr`; RenderCapabilities.exrDecode);
# the wasm has none: the web host's Worker decodes with createImageBitmap.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Natively a stream decodes with rav1d on a thread of its own; the web host
# decodes with WebCodecs (or rav1d's wasm module) beside the engine Worker.
og-video = { path = "../og-video" }
image = { workspace = true, features = ["exr", "webp"] }
# A remote SVG image natively (world/remote.rs), drawn as the cook draws a
# package's SVG (feature `fetch`).
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"], optional = true }

[features]
default = ["shaping", "physics2d", "physics3d", "fetch", "frames"]
# A published game: the probe keeps only its player-facing members, the
# renderer times no pass on the GPU (og-render's `publish`), and the
# reflected and record field docs are empty (og-core's and og-api's
# `publish`: nothing in a publish build reads them).
publish = ["og-probe/publish", "og-render/publish", "og-core/publish", "og-api/publish"]
# The 2D profile: the renderer without the 3D world subsystems (og-render's
# `profile2d`) and the runtime without terrain (src/bind/absent/terrain.rs: its
# calls and height-field colliders answer the refusal); the 2D web modules,
# docs/web-export.md §Variants.
profile2d = ["og-render/profile2d"]
# og-ui's run-time shaping (rustybuzz: Arabic, Indic and the other shaped
# scripts). A build for games without them can leave it out.
shaping = ["og-ui/shaping"]
# The physics profiles built in (og-physics): both by default; a shipping
# web variant keeps the one its game's profile uses (docs/web-export.md
# §Variants), and the other profile's calls answer that it is not built.
physics2d = ["og-physics/physics2d"]
physics3d = ["og-physics/physics3d"]
# Natively, the http(s) images documents name in url() (world/remote.rs):
# og-net's HTTP client and resvg for SVG. On the web the engine Worker
# fetches, so the wasm takes neither; a native build without it warns
# that it fetches nothing.
fetch = ["og-net/http", "dep:resvg"]
# Remote <iframe>s (og-ui's `frames`; world/remote.rs): fetching a frame's
# document from an origin project.ogt's `frames` lists, defining it, the
# executor's wait for it, and og.ui.frameMessages. Without it a remote src
# is refused when its document is parsed, og.ui.remoteFrames answers false
# and og.ui.frameMessages stays empty; local frames are always built.
# `og build` ships the web variants that have it only to a game whose
# project.ogt lists `frames` (docs/web-export.md §Variants).
frames = ["og-ui/frames"]

[dev-dependencies]
# tests/stream_release.rs cooks a small project with streaming groups.
og-cook = { path = "../og-cook" }
ttf-parser = "=0.25.1"
# tests/load_data.rs writes integrity metadata (SHA-384).
ring = "0.17"
# tests/font_packs.rs compares its frames under og-tests' tolerance.
og-tests = { path = "../og-tests" }
image = { workspace = true }
# The adapter-aware test runner (tests/gpu.rs) that makes its GPU tests
# gate-selectable probes the adapter with it.
pollster = { workspace = true }
# tests/render_compile.rs: the device's count of the pipelines it holds.
wgpu = { workspace = true, features = ["counters"] }
# tests/shared_world.rs carries two engines through a shard in the test,
# and through a real world server over WebTransport (a NAT rebind).
og-shared = { path = "../og-shared", features = ["server", "client"] }
tokio = { version = "1.53", features = ["rt-multi-thread"] }

[[test]]
name = "tests"
path = "tests/it/main.rs"

# Heap measurement's counting allocator belongs only to this binary.
[[test]]
name = "stream_bundles"
path = "tests/stream_bundles.rs"
