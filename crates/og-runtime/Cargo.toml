[package]
name = "og-runtime"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine runtime: the host-neutral implementation of the API that og-host-web and og-host-node wrap."
autotests = false

[dependencies]
og-api = { path = "../og-api" }
og-core = { path = "../og-core" }
og-env = { path = "../og-env" }
og-ecs = { path = "../og-ecs" }
og-render = { path = "../og-render" }
og-geom = { path = "../og-geom" }
og-probe = { path = "../og-probe", default-features = false }
og-bundle = { path = "../og-bundle" }
miniz_oxide = "0.8"
glam = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Shortest float formatting (serde_json's own): a system call's time payload.
zmij = "1"
og-physics = { path = "../og-physics", default-features = false }
og-audio = { path = "../og-audio" }
og-ui = { path = "../og-ui", default-features = false }
og-input = { path = "../og-input" }
og-anim = { path = "../og-anim" }
og-timeline = { path = "../og-timeline" }
og-lanes = { path = "../og-lanes" }
og-tween = { path = "../og-tween" }
og-tilemap = { path = "../og-tilemap" }
og-ai = { path = "../og-ai", optional = true }
og-story = { path = "../og-story", optional = true }
og-i18n = { path = "../og-i18n" }
og-net = { path = "../og-net" }
# Streamed video's decode plan; natively its rav1d decoder too (below).
og-video = { path = "../og-video", default-features = false, optional = true }
bincode = "1.3.3"

# og.load.imageData's decoder natively (PNG and JPEG, on a worker thread),
# and og.load.environmentData's OpenEXR (`exr`; RenderCapabilities.exrDecode);
# the wasm has none: the web host's Worker decodes with createImageBitmap.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Natively a stream decodes with rav1d on a thread of its own; the web host
# decodes with WebCodecs (or rav1d's wasm module) beside the engine Worker.
og-video = { path = "../og-video", optional = true }
image = { workspace = true, features = ["exr"] }

[features]
default = ["shaping", "physics2d", "physics3d", "story", "video", "destruction", "motion", "nav", "ai"]
# A published game: the probe keeps only its player-facing members, the
# renderer times no pass on the GPU (og-render's `publish`), and the
# reflected and record field docs are empty (og-core's and og-api's
# `publish`: nothing in a publish build reads them).
publish = ["og-probe/publish", "og-render/publish", "og-core/publish", "og-api/publish"]
# The 2D profile: the renderer without the 3D world subsystems (og-render's
# `profile2d`) and the runtime without terrain (src/bind/absent/terrain.rs: its
# calls and height-field colliders answer the refusal); the 2D web modules,
# docs/web-export.md §Variants.
profile2d = ["og-render/profile2d"]
# og-ui's run-time shaping (rustybuzz: Arabic, Indic and the other shaped
# scripts). A build for games without them can leave it out.
shaping = ["og-ui/shaping"]
# The physics profiles built in (og-physics): both by default; a shipping
# web variant keeps the one its game's profile uses (docs/web-export.md
# §Variants), and the other profile's calls answer that it is not built.
physics2d = ["og-physics/physics2d"]
physics3d = ["og-physics/physics3d"]
# The optional modules (docs/design.md §2.1): each is built in by default;
# a build without one links none of its crate, and its calls answer a
# refusal naming the feature (src/bind/absent/<module>.rs), while the world it
# leaves (records in IDL order, systems, state blocks) is the full build's
# for a game that never uses the module.
# og.story: dialogues, barks and quests (og-story; src/story.rs).
story = ["dep:og-story"]
# og.video and a document's <video> and <audio> (og-video: the streamed
# decode plan, natively its rav1d decoder; src/video.rs).
video = ["dep:og-video"]
# og.destruction: prefractured props and pixel terrain (og-physics'
# `destruction`; src/destruction.rs, src/destruction2d.rs).
destruction = ["og-physics/destruction"]
# og.motion: goals for humanoids and the motion model that draws them
# (og-anim's `motion`; src/motion.rs, src/motion/).
motion = ["og-anim/motion"]
# og.nav: grids, flow fields, navmeshes and their agents (og-ai's nav,
# with its cooked navmesh loaders; src/nav.rs).
nav = ["dep:og-ai"]
# og.ai: behaviour trees and state machines (og-ai's behaviours and
# perception; src/ai.rs). Its agents
# move through og.nav, so it needs `nav`.
ai = ["nav"]

[dev-dependencies]
# tests/stream_release.rs cooks a small project with streaming groups.
og-cook = { path = "../og-cook" }
ttf-parser = "=0.25.1"
# tests/font_packs.rs compares its frames under og-tests' tolerance.
og-tests = { path = "../og-tests" }
image = { workspace = true }
# The adapter-aware test runner (tests/gpu.rs) that makes its GPU tests
# gate-selectable probes the adapter with it.
pollster = { workspace = true }

[[test]]
name = "tests"
path = "tests/it/main.rs"
