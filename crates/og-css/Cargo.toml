[package]
name = "og-css"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine CSS values: the value lexer and calc(), shared by og-ui's documents and style packs."

[dependencies]
# Tokens quote their strings as .ogt text.
og-core = { path = "../og-core" }
serde = { version = "1", features = ["derive"] }
# CSS Color 4 and 5: absolute colours, every space and conversion, named
# colours and interpolation (linebender, as Servo uses it); libm, never
# host floating-point math.
color = { version = "0.3.3", default-features = false, features = ["libm"] }
