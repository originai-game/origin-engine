[package]
autotests = false
name = "og-i18n"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine localization: string tables (`type strings` .ogt), an ICU MessageFormat subset (placeholders, plurals, selects, numbers), CLDR plural rules, locale negotiation and text direction."

# Pure Rust over og-core; builds for wasm32-unknown-unknown.
[dependencies]
og-core = { path = "../og-core" }
# UAX #29 word boundaries (double-click selection, undo grouping), with
# ICU's dictionaries for Chinese, Japanese, Thai, Lao, Khmer and Myanmar, and
# grapheme clusters (a base and its marks drawn by one font). The version
# Parley breaks lines and words with; compiled data, no LSTM model.
icu_segmenter = { version = "2.4", default-features = false, features = ["compiled_data"] }
# Unicode full case mappings, including locale-sensitive Greek, Turkic
# and Lithuanian context rules; the same compiled data on both hosts.
icu_casemap = "2.3"
# General categories: emphasis marks skip separators and punctuation (CSS
# Text Decoration 4 §3.1), and a `::first-letter` takes the punctuation
# around its letter; the version Parley's own data is built from.
icu_properties = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_locale_core = "2.3"
icu_plurals = "2.3"
fixed_decimal = "0.7"
