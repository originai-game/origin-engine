[package]
autotests = false
name = "og-i18n"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine localization: string tables (`type strings` .ogt), an ICU MessageFormat subset (placeholders, plurals, selects, numbers), CLDR plural rules, locale negotiation and text direction."

# Pure Rust over og-core; builds for wasm32-unknown-unknown.
[dependencies]
og-core = { path = "../og-core" }
# UAX #29: word boundaries (word moves, double-click selection) and grapheme
# clusters (a base and its marks drawn by one font).
unicode-segmentation = "1.13.3"
# Unicode full case mappings, including locale-sensitive Greek, Turkic
# and Lithuanian context rules; the same compiled data on both hosts.
icu_casemap = "2.3"
icu_locale_core = "2.3"
