[package]
name = "og-idl"
version = "0.9.0+dev.20261128.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine IDL: crates/og-api/api/<module>.ogt, its model, validator and generators (TypeScript, binding table, schema, wiki, host traits and glue), behind `og api gen` and `og api check`."
autotests = false

[dependencies]
og-core = { path = "../og-core" }

[[test]]
name = "tests"
path = "tests/it/main.rs"

[dev-dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
