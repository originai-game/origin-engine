[package]
name = "og-shape-cli"
version = "0.9.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "og-shape's commands as functions (build, export, measure, preview, import, repair, decimate, unwrap, process, place, collide, rig, retarget), until og-cli's `og model` takes them"
autotests = false

[lib]
name = "og_shape_cli"
path = "src/lib.rs"

[[bin]]
name = "shape"
path = "src/main.rs"

[[test]]
name = "tests"
path = "tests/it/main.rs"

[dependencies]
og-shape = { path = "../og-shape" }
og-shape-formats = { path = "../og-shape-formats" }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[dev-dependencies]
# Compresses the arrays of the hand-written binary FBX golden case.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
float_cmp = "allow"
