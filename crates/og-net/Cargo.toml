[package]
name = "og-net"
version = "0.6.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine networking: the room protocol, deterministic lockstep (inputs, seats, late join, the shared world hash, desync detection and its component-level diff) and, natively, the local WebSocket relay and its client."

[features]
default = []
# The native relay (`og relay`) and its client (`og run --room`). Ignored on wasm32.
ws = ["dep:tungstenite"]

[dependencies]
og-core = { path = "../og-core" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"], optional = true }
