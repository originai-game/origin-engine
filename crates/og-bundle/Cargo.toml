[package]
name = "og-bundle"
version = "0.7.7"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine cooked bundle: the blob formats og-cook writes and the runtime loaders that read cooked/ .ogb blobs into og-render-data's types (what the renderer draws) and plain scene data."

# Pure Rust by default, builds for wasm32-unknown-unknown.
[features]
default = []
# The navmesh loaders (`navmesh`, `navmesh_areas`, `navmesh_links`), into
# og-ai's nav types; og-runtime's `nav` turns it on.
nav = ["dep:og-ai"]
# Native Basis Universal transcoding of cooked KTX2 textures to RGBA8 for
# og-render (C++ through basis-universal; not for wasm32, where the host
# transcodes with Binomial's wasm transcoder).
transcode = ["dep:basis-universal", "dep:ruzstd"]
# `.basis` → KTX2 wrapping for the cook's basis-universal encoder.
basis = ["dep:basis-universal", "dep:ruzstd"]

[dependencies]
og-blob = { path = "../og-blob" }
og-core = { path = "../og-core" }
# The cooked data the renderer draws (docs/design.md §2.1, "Formats below
# features"), not the renderer.
og-render-data = { path = "../og-render-data" }
# The UI's vector shapes and paints and the glyph keys (og-draw's, as
# the renderer draws them).
og-draw = { path = "../og-draw" }
og-anim = { path = "../og-anim" }
og-tilemap = { path = "../og-tilemap" }
og-timeline = { path = "../og-timeline" }
# Cooked navmeshes load into og-ai's nav types (`nav`).
og-ai = { path = "../og-ai", optional = true }
glam = { workspace = true }
# pod_collect_to_vec (the vertex tables), which og-render's own
# dependencies turned on before.
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
miniz_oxide = "0.8"
serde_json = "1"
opus-pure = { workspace = true }
basis-universal = { version = "0.3.1", optional = true }
ruzstd = { version = "0.9.1", optional = true }
