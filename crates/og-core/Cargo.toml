[package]
name = "og-core"
version = "0.7.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine core: handles, reflection, .ogt text, deterministic rng and math, time"
autotests = false

[features]
# A published game (og-runtime's `publish`): `#[derive(Reflect)]` writes
# empty docs into its schemas (`reflect_doc!`), so the text is not linked;
# nothing in a publish build reads them (the probe's schema members, the
# inspector and Tune are not built in).
publish = []

[dependencies]
og-core-derive = { path = "../og-core-derive" }
glam = { workspace = true }
bytemuck = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# idmap tests: an IdMap writes the same save bytes as the BTreeMap it replaces.
bincode = "1.3.3"

[[test]]
name = "tests"
path = "tests/main.rs"
