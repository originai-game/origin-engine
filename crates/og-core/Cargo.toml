[package]
name = "og-core"
version = "0.9.0+dev.20261128.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Origin Engine core: handles, reflection, .ogt text, deterministic rng and math, time"
autotests = false

[features]
# A published game (og-runtime's `publish`): `#[derive(Reflect)]` writes
# empty docs into its schemas (`reflect_doc!`), so the text is not linked;
# nothing in a publish build reads them (the probe's schema members, the
# inspector and Tune are not built in).
publish = []
# Structural author schemas are tooling only; packed runtime reflection does
# not link the derive/JSON Schema validator or its regular-expression engine.
source = ["dep:schemars", "dep:jsonschema", "dep:serde_path_to_error"]

[dependencies]
og-core-derive = { path = "../og-core-derive" }
glam = { workspace = true }
bytemuck = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = { version = "=1.2.3", optional = true }
# No network or filesystem schema resolution in author tools.
jsonschema = { version = "=0.63.2", default-features = false, optional = true }
serde_path_to_error = { version = "0.1", optional = true }

[[test]]
name = "layers"
path = "tests/layers.rs"

[[test]]
name = "source"
path = "tests/source.rs"
required-features = ["source"]
