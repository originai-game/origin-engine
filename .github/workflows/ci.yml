# The gate is scripts/check.sh; this workflow only provisions the machine
# (.github/actions/provision) and runs it (docs/ci.md §What runs where).
# Keep logic in the scripts so local and CI runs match.
name: ci

# By hand only (docs/ci.md §CI, 2026-11-01): no push, pull request or
# schedule starts it. The local gate is the signal for a merge (the
# coordinator's functional lane and the wave-end run); run one lane here
# when a shared-runner record is needed:
# `gh workflow run ci.yml --ref <branch> -f lane=gate`.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: "The lane to run (docs/ci.md §Lanes)"
        type: choice
        options: [gate, quick, functional, perf]
        default: gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.lane }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Line numbers in CI backtraces; the dev profile has no debuginfo because
  # macOS keeps it in object files (Cargo.toml [profile.dev]).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # .cargo/config.toml's sccache is for the shared local machine; CI caches
  # target/ instead, and an empty RUSTC_WRAPPER turns the wrapper off.
  RUSTC_WRAPPER: ""
  OG_EVIDENCE_DIR: ${{ github.workspace }}/target/evidence
  # One gate per runner: no machine-wide queue to wait in (scripts/lock.sh).
  OG_GATE_MACHINE_LOCK: "0"
  # packages/engine's bun tests have the M4 Pro's 5 s default; a render
  # test on two vCPU of Lavapipe takes 5 to 25 s (docs/ci.md §CI).
  OG_BUN_TEST_TIMEOUT: "60000"
  # A test's own longer limit, scaled (packages/engine/tests/support/slow.ts):
  # the terrain station's two 600-tick og runs passed 240 s there.
  OG_TEST_TIME_SCALE: "3"

jobs:
  # The quick lane (docs/ci.md §Lanes).
  quick:
    if: inputs.lane == 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: &container
      # Debian trixie: its Lavapipe is the og-lavapipe image's (LLVM 19.1.7),
      # the Mesa the vulkan-cpu references are recorded with; Ubuntu 24.04's
      # (LLVM 20.1.2) misses two of them by RMSE 0.0003 (docs/ci.md §CI).
      # The host's unused SDKs are mounted to be emptied (provision).
      image: debian:trixie
      # An init as PID 1 reaps orphans, as on a machine: og dev's signal
      # test waits for the game it started to be gone, not a zombie.
      options: --init
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
        - /opt/hostedtoolcache/CodeQL:/host/codeql
    defaults: &defaults
      run:
        shell: bash
    steps:
      - &git
        name: Git for the checkout
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - uses: ./.github/actions/provision
        with:
          cache-key: quick-trixie
      - name: Lint the gate scripts
        run: shellcheck -x scripts/*.sh
      - name: Quick lane
        run: scripts/check.sh quick
      - name: Disk
        if: always()
        run: df -h "$GITHUB_WORKSPACE" | tail -1; du -sh target 2>/dev/null || true
      - name: Upload evidence
        if: failure()
        continue-on-error: true # the account's artifact quota must not fail a lane
        uses: actions/upload-artifact@v4
        with:
          name: evidence-quick-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: target/evidence/**

  # The functional lane: what a merge to main passes locally (AGENTS.md
  # §When to run the gate).
  functional:
    if: inputs.lane == 'functional'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: *container
    defaults: *defaults
    steps:
      - *git
      - uses: actions/checkout@v4
      - uses: ./.github/actions/provision
        with:
          cache-key: functional-trixie
      # A fresh runner has no web module, which bun-functional needs whole
      # (it fails rather than test a subset), so the job builds it; and no
      # GPU, so the kit's frames are unchecked on purpose (OG_RENDERER=none;
      # otherwise ui-styles and ui-kit fail on an unchecked frame).
      - name: Functional lane
        env:
          OG_RENDERER: none
        run: scripts/check.sh functional wasm-build wasm-opt
      - name: Disk
        if: always()
        run: df -h "$GITHUB_WORKSPACE" | tail -1; du -sh target 2>/dev/null || true
      - name: Upload evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: evidence-functional-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            target/evidence/**
            **/*.diff.png

  # The full lane with CI set: every step and test, the shipping wasm profile.
  gate:
    if: inputs.lane == 'gate'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: *container
    defaults: *defaults
    steps:
      - *git
      - uses: actions/checkout@v4
      - uses: ./.github/actions/provision
        with:
          cache-key: gate-trixie
      - name: Lint the gate scripts
        run: shellcheck -x scripts/*.sh
      - name: Gate
        run: scripts/check.sh
        env:
          # One step at a time: on two vCPU, bun-test beside test starved
          # both, and bun-test's time-bound tests failed.
          OG_GATE_JOBS: "1"
      - name: Disk
        if: always()
        run: df -h "$GITHUB_WORKSPACE" | tail -1; du -sh target 2>/dev/null || true
      - name: Upload evidence
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            target/evidence/**
            target/og-wasm/*.txt
            **/*.diff.png
      - name: Upload size report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: size-gate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            target/evidence/size-gate.json
            target/evidence/check-summary.txt

  # The perf suite (docs/ci.md §What runs where, `make perf`).
  perf:
    if: inputs.lane == 'perf'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: *container
    defaults: *defaults
    steps:
      - *git
      - uses: actions/checkout@v4
      - uses: ./.github/actions/provision
        with:
          cache-key: perf-trixie
      - name: Perf suite
        run: scripts/perf.sh --measure
      - name: Upload perf evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: target/evidence/perf/**
