# The gate is scripts/check.sh; this workflow only provisions the machine and
# runs it (docs/ci.md). Keep logic in the scripts so local and CI runs match.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly perf baseline, 03:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  OG_EVIDENCE_DIR: ${{ github.workspace }}/target/evidence

jobs:
  # The quick lane (docs/ci.md §Lanes): the PR signal in a few minutes.
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-on-failure: true
          rustflags: ""
      - uses: taiki-e/install-action@nextest
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: og-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/install-tools.sh') }}
      - name: Tools (wasm-bindgen-cli, wasm-opt, brotli, bun)
        run: scripts/install-tools.sh
      - name: Quick lane
        run: scripts/check.sh quick

  gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml (channel, rustfmt, clippy, wasm32 target)
      # and caches ~/.cargo and target/ through Swatinem/rust-cache.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-on-failure: true
          rustflags: ""
      - uses: taiki-e/install-action@nextest

      # Lavapipe gives wgpu a Vulkan adapter for headless gfx tests.
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers brotli

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: og-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/install-tools.sh') }}

      - name: Tools (wasm-bindgen-cli, wasm-opt, brotli, bun)
        run: scripts/install-tools.sh

      - name: Lint the gate scripts
        run: shellcheck -x scripts/*.sh

      - name: Gate
        run: scripts/check.sh

      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            target/evidence/**
            target/og-wasm/*.txt
            **/*.diff.png

      - name: Upload size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-gate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            target/evidence/size-gate.json
            target/evidence/check-summary.txt

  # Skeleton: the perf suite against committed baselines (docs/phase-1.md §1,
  # tests/ perf). og-tests registers its perf tests as #[ignore] with "perf" in
  # the name; until it has any, this job runs zero tests and passes.
  perf-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          rustflags: ""
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
      - name: Perf suite
        run: cargo test -p og-tests --release -- --ignored perf
      - name: Upload perf evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.run_id }}
          if-no-files-found: ignore
          path: target/evidence/**
