# Normalised from Cargo.toml.orig (rune's workspace fields written out): see PATCHED.md.
[package]
name = "rune-motion"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rune's animation runtime: analytic springs, retargetable tracks, presence, layout and matched-geometry animation."
publish = false
autotests = false

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
