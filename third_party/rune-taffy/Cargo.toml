# Normalised from Cargo.toml.orig (rune's workspace fields written out): see PATCHED.md.
[package]
name = "rune-taffy"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Compact retained layout store driving Taffy's Flexbox, Grid, and Block solvers for Rune."

[features]
default = []
baseline-taffy = []

[dependencies]
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
stacker = "0.1"
